# Читалка отзывов квеста: чип отзывов на карточке → модалка со списком отзывов.
# Регрессия, которую ловит: кнопка отзывов вела на старт квеста (web-хеш на native).
#
# После сортировки «Популярные» (#1790) квесты с отзывами не попадают на первый
# экран, а чип рисуется только при ratingCount > 0 (#1792). Сценарий адресует
# конкретный квест через срез «Квесты с отзывами» (лист «Выбрать город»), а не
# первую карточку каталога. Поиск по названию не используется: Maestro на Android
# не вводит кириллицу (`inputText` → «Unicode character input is not supported»).
# Гостевой прогон: вкладка «Профиль» показывает «Войдите в аккаунт» до любого
# действия (на главной у гостя кнопки «Войти» нет — только «Открыть меню»),
# прогресс аккаунта не трогаем.
appId: by.metravel.app
---
- runFlow: launch.yaml
- tapOn: "Профиль"
- assertVisible: "Войдите в аккаунт"
- tapOn: "Квесты"
- assertVisible: "Все квесты"
- tapOn: "Выбрать город"
# accessibilityLabel строки среза: «Квесты с отзывами, N квестов»
- tapOn:
    text: "Квесты с отзывами.*"
- assertVisible: "Квест по Гомелю: дворец Румянцевых и Паскевичей"
# Компактный чип отзывов (accessibilityLabel "Посмотреть отзывы: N отзыв")
- tapOn:
    text: "Посмотреть отзывы.*"
- assertVisible: "Отзывы о квесте"
# Закрыть модалку крестиком (testID quest-reviews-close), затем убедиться, что закрылась
- tapOn:
    id: "quest-reviews-close"
- assertNotVisible: "Отзывы о квесте"
