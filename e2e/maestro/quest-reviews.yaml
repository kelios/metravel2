# Читалка отзывов квеста: чип отзывов на карточке → модалка со списком отзывов.
# Регрессия, которую ловит: кнопка отзывов вела на старт квеста (web-хеш на native).
#
# После сортировки «Популярные» (#1790) квесты с отзывами не попадают на первый
# экран, а чип рисуется только при ratingCount > 0 (#1792). Сценарий ищет
# конкретный квест по названию, а не первую карточку каталога.
# Гостевой прогон: «Войти» видно до любого действия, прогресс аккаунта не трогаем.
appId: by.metravel.app
---
- runFlow: launch.yaml
- assertVisible: "Войти"
- tapOn: "Квесты"
- assertVisible: "Все квесты"
- tapOn: "Поиск квестов по названию, городу или сюжету"
- inputText: "Гомелю"
- hideKeyboard
- assertVisible: "Квест по Гомелю: дворец Румянцевых и Паскевичей"
# Компактный чип отзывов (accessibilityLabel "Посмотреть отзывы: N отзыв")
- tapOn:
    text: "Посмотреть отзывы.*"
- assertVisible: "Отзывы о квесте"
# Закрыть модалку крестиком (testID quest-reviews-close), затем убедиться, что закрылась
- tapOn:
    id: "quest-reviews-close"
- assertNotVisible: "Отзывы о квесте"
