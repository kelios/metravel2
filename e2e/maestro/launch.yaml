# Common subflow, not an independent suite. Release launches never attempt an
# Expo URL. DEV_CLIENT=1 explicitly selects the local Metro deep-link on Android
# with adb reverse configured (or on the iOS simulator). No reset of app data.
appId: by.metravel.app
---
- launchApp
# An interrupted previous app link can leave its iOS confirmation above Home.
# Cancel that pending navigation before checking the initial app shell.
- runFlow:
    file: confirm-ios-app-link.yaml
    env:
      APP_LINK_CONTEXT: launch
- runFlow:
    when:
      true: ${typeof DEV_CLIENT !== 'undefined' && DEV_CLIENT == '1'}
    commands:
      - openLink: "exp+metravel://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible:
      text: "Маршруты|Куда поехать|Все квесты"
    timeout: 30000
# Чистая установка показывает онбординг поверх главной: он перехватывает тапы по доку.
# Пропускаем его, если он есть (accessibilityLabel кнопки «Пропустить»).
- tapOn:
    text: "Пропустить онбординг"
    optional: true
