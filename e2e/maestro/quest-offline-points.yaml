# Офлайн-точки квеста (native-only регресс): кнопки топ-бара готовят .gpx и открывают share.
# Регрессия, которую ловит: legacy expo-file-system throw на SDK 56 (фикс — /legacy).
#
# Тот же квест, что и intro-map: «Квест по Кракову: Вавельский дракон»
# (`krakow-dragon`, deep link; 9 точек, 6 заданий). Не первый пункт каталога —
# порядок после #1790 не стабилен.
# Только гость (вкладка «Профиль» → «Войдите в аккаунт»): сброс не стирает
# прохождения залогиненного аккаунта.
appId: by.metravel.app
---
- runFlow: launch.yaml
- tapOn: "Профиль"
- assertVisible: "Войдите в аккаунт"
# Квест открывается по id deep link'ом: Maestro на Android не вводит кириллицу
# (`inputText` → «Unicode character input is not supported»), поиск по названию недоступен.
- openLink: "metravel://quests/krakow/krakow-dragon"
- extendedWaitUntil:
    visible: "Квест по Кракову: Вавельский дракон"
    timeout: 30000
# #1669/#2148: на телефоне действия шапки (сброс, GPX, «открыть в приложении»)
# живут в «⋯» строки экрана («Ещё действия») — сначала открываем его, потом
# жмём действие. Лист
# закрывается сам при выборе строки, поэтому перед каждым действием он
# открывается заново.
- tapOn: "Ещё действия"
- tapOn: "Сбросить прогресс"
- tapOn: "ОК"
- assertVisible: ".*Задания: 0 / 6.*"
- scrollUntilVisible:
    element:
      text: "Карта квеста"
    direction: DOWN
    timeout: 25000
- assertVisible: "Карта квеста"
# Строка «N точек на карте» стоит под заголовком карты и после первой прокрутки
# остаётся за нижним доком — доводим её до середины экрана.
- scrollUntilVisible:
    element:
      text: "9 точек на карте"
    direction: DOWN
    timeout: 25000
    centerElement: true
- assertVisible: "9 точек на карте"
# Строка экрана → «⋯»: «Скачать GPX с N точками квеста» (accessibilityLabel из
# questScreenHeaderModel.ts). Пункт есть в листе только когда точки уже посчитаны —
# выше это доказал ассерт «9 точек на карте».
- tapOn: "Ещё действия"
- tapOn:
    text: "Скачать GPX.*"
# Должен открыться системный share с .gpx (а НЕ тост «Не удалось подготовить точки…»)
- assertVisible:
    text: ".*\\.gpx.*"
- back
# Вторая кнопка листа: «Открыть точки квеста в приложении карт» → тост успеха + share
- tapOn: "Ещё действия"
- tapOn: "Открыть точки квеста в приложении карт"
- assertVisible:
    text: "(Файл с точками квеста готов|.*\\.gpx.*)"
