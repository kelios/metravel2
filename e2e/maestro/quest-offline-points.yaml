# Офлайн-точки квеста (native-only регресс): кнопки топ-бара готовят .gpx и открывают share.
# Регрессия, которую ловит: legacy expo-file-system throw на SDK 56 (фикс — /legacy).
appId: by.metravel.app
---
- runFlow: launch.yaml
- tapOn: "Квесты"
- assertVisible: "Все квесты"
- tapOn:
    text: "Начать приключение.*"
    index: 0
# #1669: на телефоне редкие действия шапки (сброс, GPX, «открыть в приложении»)
# живут в листе «Ещё» — сначала открываем его, потом жмём действие. Лист
# закрывается сам при выборе строки, поэтому перед каждым действием он
# открывается заново.
- tapOn: "Действия с квестом"
- tapOn: "Сбросить прогресс"
- tapOn: "ОК"
- assertVisible: "0 / 9"
- scrollUntilVisible:
    element:
      text: "Карта квеста"
    direction: DOWN
    timeout: 25000
- assertVisible: "Карта квеста"
- assertVisible: "9 точек на карте"
# Шапка деталки → «Ещё»: «Скачать GPX с N точками квеста» (accessibilityLabel из
# questWizardShell.tsx). Пункт есть в листе только когда точки уже посчитаны —
# выше это доказал ассерт «9 точек на карте».
- tapOn: "Действия с квестом"
- tapOn:
    text: "Скачать GPX.*"
# Должен открыться системный share с .gpx (а НЕ тост «Не удалось подготовить точки…»)
- assertVisible:
    text: ".*\\.gpx.*"
- back
# Вторая кнопка листа: «Открыть точки квеста в приложении карт» → тост успеха + share
- tapOn: "Действия с квестом"
- tapOn: "Открыть точки квеста в приложении карт"
- assertVisible:
    text: "(Файл с точками квеста готов|.*\\.gpx.*)"
