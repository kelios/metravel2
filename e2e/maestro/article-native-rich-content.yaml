# Public guest regression for the SDK 57 native rich-HTML renderer. The fixed
# article is the same Christmas-markets/Wroclaw article used by web acceptance.
# Captions and view IDs do not attest image decode or sharp pixels; the tester
# inspects hero/body images separately. No auth, content or account mutations.
appId: by.metravel.app
---
- runFlow: open-sdk-review-article.yaml
- scrollUntilVisible:
    element:
      id: "travel-quick-jump-description"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "travel-quick-jump-description"
# These two headings are real article HTML rendered by StableContent.native,
# not hero metadata, an app-owned loading placeholder or a web-only DOM check.
- scrollUntilVisible:
    element:
      text: "^Даты и места одним списком$"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "^Даты и места одним списком$"
- scrollUntilVisible:
    element:
      text: "^Вроцлав: дождь на Рынке, гномы и кружки-сапожки$"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "^Вроцлав: дождь на Рынке, гномы и кружки-сапожки$"
