# Intro-карта квеста (native-only регресс): карта деталки должна показать точки маршрута до старта.
# Регрессия, которую ловит: Leaflet/WebView показывает тайлы, но не рисует маркеры квеста.
#
# Квест адресуется по id (deep link), не по позиции в каталоге: после сортировки
# «Популярные» (#1790) первый квест списка больше не стабилен. «Квест по Кракову:
# Вавельский дракон» (`krakow-dragon`) — 9 точек на карте, из них 6 с заданиями:
# строка прогресса «Задания: 0 / 6», карта «9 точек на карте».
# Только гость (вкладка «Профиль» → «Войдите в аккаунт»): сброс пишет в локальный
# прогресс и не трогает прохождения аккаунта.
appId: by.metravel.app
---
- runFlow: launch.yaml
- tapOn: "Профиль"
- assertVisible: "Войдите в аккаунт"
# Квест открывается по id deep link'ом: Maestro на Android не вводит кириллицу
# (`inputText` → «Unicode character input is not supported»), поиск по названию недоступен.
- openLink: "metravel://quests/krakow/krakow-dragon"
- extendedWaitUntil:
    visible: "Квест по Кракову: Вавельский дракон"
    timeout: 30000
# #1669/#2148: на телефоне действия шапки (сброс, GPX, «открыть в приложении»)
# живут в «⋯» строки экрана («Ещё действия») — сначала открываем его, потом
# жмём действие. Лист
# закрывается сам при выборе строки, поэтому перед каждым действием он
# открывается заново.
- tapOn: "Ещё действия"
- tapOn: "Сбросить прогресс"
- tapOn: "ОК"
- assertVisible: ".*Задания: 0 / 6.*"
- scrollUntilVisible:
    element:
      text: "Карта квеста"
    direction: DOWN
    timeout: 25000
- assertVisible: "Карта квеста"
# Строка «N точек на карте» стоит под заголовком карты и после первой прокрутки
# остаётся за нижним доком — доводим её до середины экрана.
- scrollUntilVisible:
    element:
      text: "9 точек на карте"
    direction: DOWN
    timeout: 25000
    centerElement: true
- assertVisible: "9 точек на карте"
