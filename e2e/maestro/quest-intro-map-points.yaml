# Intro-карта квеста (native-only регресс): карта деталки должна показать точки маршрута до старта.
# Регрессия, которую ловит: Leaflet/WebView показывает тайлы, но не рисует маркеры квеста.
#
# Квест адресуется по названию, не по позиции в каталоге: после сортировки
# «Популярные» (#1790) первый квест списка больше не стабилен. «Квест по Кракову:
# Вавельский дракон» — 9 точек, тот же контракт «0 / 9» и «9 точек».
# Только гость: сброс пишет в локальный прогресс и не трогает прохождения аккаунта.
appId: by.metravel.app
---
- runFlow: launch.yaml
- assertVisible: "Войти"
- tapOn: "Квесты"
- assertVisible: "Все квесты"
- tapOn: "Поиск квестов по названию, городу или сюжету"
- inputText: "Вавель"
- hideKeyboard
- tapOn: "Начать приключение: Квест по Кракову: Вавельский дракон"
# #1669/#2148: на телефоне действия шапки (сброс, GPX, «открыть в приложении»)
# живут в «⋯» строки экрана («Ещё действия») — сначала открываем его, потом
# жмём действие. Лист
# закрывается сам при выборе строки, поэтому перед каждым действием он
# открывается заново.
- tapOn: "Ещё действия"
- tapOn: "Сбросить прогресс"
- tapOn: "ОК"
- assertVisible: "0 / 9"
- scrollUntilVisible:
    element:
      text: "Карта квеста"
    direction: DOWN
    timeout: 25000
- assertVisible: "Карта квеста"
- assertVisible: "9 точек на карте"
