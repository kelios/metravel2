            - generic [ref=f5e1180]:
              - 'button "Хельская коса: маяк в В Ястарне - Маяк Гора-Шведов - Хельский маяк, развёрнуто" [expanded] [ref=f5e1181] [cursor=pointer]':
                - generic [ref=f5e1182]:
                  - 'img "Хельская коса: маяк в В Ястарне - Маяк Гора-Шведов - Хельский маяк" [ref=f5e1185]'
                  - generic [ref=f5e1186]: "Хельская коса: маяк в В Ястарне - Маяк Гора-Шведов - Хельский маяк"
                - generic [ref=f5e1188]:
                  - generic [ref=f5e1189]: 
                  - generic [ref=f5e1190]: 
              - generic [ref=f5e1192]:
                - generic [ref=f5e1193]: "лучший сезон: апрель · ~14 мин чтения"
                - heading "Содержание маршрута" [level=2] [ref=f5e1195]
                - generic [ref=f5e1424]:
                  - paragraph [ref=f5e1425]: "Мы прожили неделю на польской Балтике в апреле — сняли дом на озере в Кашубии и оттуда каждый день уезжали в новую сторону. Главным днём стал день рождения мужа: мы проехали почти всю Хельскую косу и посмотрели три маяка — в Ястарне, Гору Шведов и Хельский. Но неделя оказалась намного шире одного маршрута, поэтому здесь всё: где мы жили с двумя собаками, что смотреть вокруг, дюны Словинского парка, крепость Хеля и как всё это связать в поездку."
                  - paragraph [ref=f5e1427]:
                    - img "Пустой пляж Хельской косы под перистыми облаками" [ref=f5e1428]
                  - 'heading "Кратко: маршрут недели" [level=2] [ref=f5e1429]'
                  - paragraph [ref=f5e1430]: Апрель, семь ночей, база — один дом, из которого удобно ездить в обе стороны побережья.
                  - list [ref=f5e1431]:
                    - listitem [ref=f5e1432]:
                      - strong [ref=f5e1433]: День 1.
                      - text: Заезд, дом на озере в Кшыне (Krzynia), гмина Дембница-Кашубска — 30 км от Слупска.
                    - listitem [ref=f5e1434]:
                      - strong [ref=f5e1435]: День 2.
                      - text: "Велопрогулка по ландшафтному парку «Долина Слупи»: аллеи, река, бобровые разливы."
                    - listitem [ref=f5e1436]:
                      - strong [ref=f5e1437]: День 3.
                      - text: Словинский национальный парк, дюны Чолпино и пустой апрельский пляж.
                    - listitem [ref=f5e1438]:
                      - strong [ref=f5e1439]: День 4.
                      - text: Отдых у дома, озеро, костёр, прогулки с собаками.
                    - listitem [ref=f5e1440]:
                      - strong [ref=f5e1441]: День 5.
                      - text: "Хельская коса: маяки Розеве, Ястарня, Хель, крепость и Гора Шведов — с раннего утра до заката."
                    - listitem [ref=f5e1442]:
                      - strong [ref=f5e1443]: Дни 6–7.
                      - text: Окрестности, второй заход на пляж, дорога домой.
                  - paragraph [ref=f5e1444]: "Если у вас не неделя, а выходные — берите день на Хельскую косу и день на Словинский парк, а ночевать лучше не на самой косе: в глубине Кашубии дешевле, тише и есть куда выпустить собак."
                  - 'heading "Где мы жили: дом на озере в Кашубии" [level=2] [ref=f5e1445]'
                  - paragraph [ref=f5e1446]:
                    - text: Мы искали жильё под простое условие —
                    - strong [ref=f5e1447]: две собаки
                    - text: ", свой участок и никакого «тихого часа» с соседями за стеной. В итоге сняли дом на берегу озера в деревне"
                    - strong [ref=f5e1448]: Кшыня (Krzynia)
                    - text: ", гмина Дембница-Кашубска, Слупский повят."
                  - paragraph [ref=f5e1449]: "Дом — современный барн-хаус: тёмный фасад, крытая терраса, панорамные окна во всю стену и чугунная печь, которую в апреле топишь каждый вечер. За окном — лес и вода, до берега двести метров."
                  - generic [ref=f5e1450]:
                    - paragraph [ref=f5e1451]:
                      - img "Дом-барнхаус с крытой террасой на берегу озера в Кшыне" [ref=f5e1452]
                    - paragraph [ref=f5e1453]:
                      - img "Чугунная печь и дрова в гостиной дома" [ref=f5e1454]
                  - paragraph [ref=f5e1455]: "Утро выглядело так: печь, кофе, панорамное окно и озеро, которое в безветрие превращается в зеркало."
                  - generic [ref=f5e1456]:
                    - paragraph [ref=f5e1457]:
                      - img "Завтрак за столом у панорамного окна с видом на лес" [ref=f5e1458]
                    - paragraph [ref=f5e1459]:
                      - 'img "Озеро Кшыня в безветрие: вода как зеркало" [ref=f5e1460]'
                  - paragraph [ref=f5e1461]: К воде ведут деревянные мостки — главное место дома. Мы выходили туда на рассвете и на закате, и оба раза это было лучше любой смотровой площадки.
                  - generic [ref=f5e1462]:
                    - paragraph [ref=f5e1463]:
                      - img "Деревянные мостки над озером на закате" [ref=f5e1464]
                    - paragraph [ref=f5e1465]:
                      - img "Мостки над озером с собакой в утреннем солнце" [ref=f5e1466]
                  - heading "Про собак — что важно знать заранее" [level=3] [ref=f5e1467]
                  - paragraph [ref=f5e1468]: "Ехать на Балтику с собаками в апреле — отличная идея: пляжи пустые, ограничения высокого сезона не действуют, а вода уже достаточно тёплая, чтобы пёс лез в неё сам."
                  - generic [ref=f5e1469]:
                    - paragraph [ref=f5e1470]:
                      - img "Собака у чугунной печи в доме" [ref=f5e1471]
                    - paragraph [ref=f5e1472]:
                      - img "Собака спит на ковре у печки" [ref=f5e1473]
                  - paragraph [ref=f5e1474]: "Что мы вынесли из недели:"
                  - list [ref=f5e1475]:
                    - listitem [ref=f5e1476]:
                      - strong [ref=f5e1477]: Ищите дом с участком, а не квартиру.
                      - text: В Польше много объектов с пометкой «przyjazny zwierzętom» / «pies mile widziany», но у части из них это значит «можно, если маленькая». Уточняйте размер и количество.
                    - listitem [ref=f5e1478]:
                      - strong [ref=f5e1479]: Спрашивайте про забор.
                      - text: "Огороженный участок меняет всю поездку: собак можно просто выпустить."
                    - listitem [ref=f5e1480]:
                      - strong [ref=f5e1481]: Берите свои миски, лежанку и старое полотенце.
                      - text: После озера пёс приходит мокрый и в песке, а хозяйские полотенца для этого не предназначены.
                    - listitem [ref=f5e1482]:
                      - strong [ref=f5e1483]: На пляжах смотрите таблички.
                      - text: В сезон на охраняемых участках собаки запрещены, но вне сезона и на «диких» отрезках косы и Словинского парка проблем нет.
                    - listitem [ref=f5e1484]:
                      - strong [ref=f5e1485]: В нацпарке собака — только на поводке.
                      - text: Это правило, а не рекомендация.
                  - paragraph [ref=f5e1487]:
                    - img "Собаки купаются в озере у берега" [ref=f5e1488]
                  - paragraph [ref=f5e1489]:
                    - text: Само озеро в Кшыне — не природное, а
                    - strong [ref=f5e1490]: водохранилище на реке Слупя
                    - text: ". Чуть выше по дороге стоит старая гидроэлектростанция 1920-х годов: именно её плотина и создала эту воду. Такие маленькие ГЭС на Слупи — местная особенность, их тут целый каскад."
                  - paragraph [ref=f5e1492]:
                    - img "Старая гидроэлектростанция 1920-х годов на реке Слупя" [ref=f5e1493]
                  - 'heading "Что смотреть вокруг: ландшафтный парк «Долина Слупи»" [level=2] [ref=f5e1494]'
                  - paragraph [ref=f5e1495]:
                    - text: "Мы не сразу поняли, как нам повезло с местом: дом стоит внутри ландшафтного парка"
                    - strong [ref=f5e1496]: «Dolina Słupi»
                    - text: . Это не громкая достопримечательность, а именно та Польша, ради которой стоит снимать дом на неделю, а не отель на две ночи.
                  - paragraph [ref=f5e1497]: "Один день мы просто взяли велосипеды и поехали куда глаза глядят. Дороги здесь двух видов: старые брусчатые аллеи между вековыми деревьями и грунтовки через поля."
                  - generic [ref=f5e1498]:
                    - paragraph [ref=f5e1499]:
                      - img "Велосипед на старой брусчатой аллее между деревьями" [ref=f5e1500]
                    - paragraph [ref=f5e1501]:
                      - img "Велосипед в поле у аллеи вековых деревьев" [ref=f5e1502]
                  - paragraph [ref=f5e1503]: По пути — пастбища с коровами, которых тут выпускают на весь тёплый сезон, и полное отсутствие машин.
                  - paragraph [ref=f5e1505]:
                    - img "Пастбище со стадом в ландшафтном парке «Долина Слупи»" [ref=f5e1506]
                  - paragraph [ref=f5e1507]:
                    - text: Главная героиня парка — сама
                    - strong [ref=f5e1508]: Слупя
                    - text: ": быстрая, чистая, петляющая река, знаменитая тем, что в неё заходит на нерест лосось. Вдоль неё идут тропы, а рядом видно работу бобров — целые разливы с затопленным лесом."
                  - generic [ref=f5e1509]:
                    - paragraph [ref=f5e1510]:
                      - img "Река Слупя в тростнике" [ref=f5e1511]
                    - paragraph [ref=f5e1512]:
                      - img "Бобровые разливы с затопленным лесом" [ref=f5e1513]
                  - paragraph [ref=f5e1514]:
                    - strong [ref=f5e1515]: "Маршрут на день:"
                    - text: Кшыня — Зaклодно — Дембница-Кашубска — Желькувко и обратно, около 30–35 км по кругу, почти всё по грунтовкам и лесным дорогам, набор высоты небольшой. Годится и для обычного гибрида.
                  - 'heading "Словинский национальный парк: дюны Чолпино" [level=2] [ref=f5e1516]'
                  - paragraph [ref=f5e1517]:
                    - text: За дюнами обычно едут в Лебу, но мы пошли с другой стороны — от деревни
                    - strong [ref=f5e1518]: Чолпино (Czołpino)
                    - text: . Там меньше людей, и дюна выходит прямо к морю.
                  - paragraph [ref=f5e1519]: От парковки к морю ведёт длинная сосновая аллея — километра полтора идеально прямой дороги в бору.
                  - paragraph [ref=f5e1521]:
                    - img "Прямая сосновая аллея от парковки Чолпино к морю" [ref=f5e1522]
                  - paragraph [ref=f5e1523]: "А потом лес заканчивается, и начинается белое: подвижные дюны, редкие сосны, вывернутые ветром, и ни одного человека в кадре."
                  - generic [ref=f5e1524]:
                    - paragraph [ref=f5e1525]:
                      - img "Белая подвижная дюна с соснами в Словинском парке" [ref=f5e1526]
                    - paragraph [ref=f5e1527]:
                      - img "Человек на гребне дюны Чолпино" [ref=f5e1528]
                  - paragraph [ref=f5e1529]: Дальше — пляж. В апреле он выглядит так, будто вы первые, кто на него вышел.
                  - generic [ref=f5e1530]:
                    - paragraph [ref=f5e1531]:
                      - img "Пустой апрельский пляж Балтики у Чолпино" [ref=f5e1532]
                    - paragraph [ref=f5e1533]:
                      - img "На пляже Словинского парка в апреле" [ref=f5e1534]
                  - paragraph [ref=f5e1535]: В дюнах прячутся бетонные руины — остатки военных сооружений, которые уже наполовину съел песок. Это не «достопримечательность», их нет в путеводителях, но они очень хорошо объясняют, что это за берег.
                  - paragraph [ref=f5e1537]:
                    - img "Бетонные военные руины, наполовину занесённые песком" [ref=f5e1538]
                  - paragraph [ref=f5e1539]:
                    - text: Рядом стоит
                    - strong [ref=f5e1540]: маяк Чолпино
                    - text: — он спрятан в лесу на дюне, на высоте около 55 метров над уровнем моря, поэтому сама башня невысокая, а свет виден далеко. Подъём наверх открыт в сезон.
                  - paragraph [ref=f5e1541]:
                    - text: "Подробнее про парк, знаменитые «ходячие» дюны у Лебы и практические детали — в отдельной статье:"
                    - link "Словинский национальный парк" [ref=f5e1542] [cursor=pointer]:
                      - /url: https://metravel.by/travels/slovinskiy-nacionalnyy-park-slupsk
                    - text: .
                  - heading "День маяков на Хельской косе" [level=2] [ref=f5e1543]
                  - paragraph [ref=f5e1544]: "Это был день рождения мужа, и он сам выбрал программу: проехать косу и собрать маяки. Вышло около 12 часов в дороге и на ногах — и это лучший день недели."
                  - heading "Где находится Хельская коса" [level=3] [ref=f5e1545]
                  - paragraph [ref=f5e1546]: "Хельская коса — узкая песчаная полоса длиной около 35 км на севере Польши, в Поморском воеводстве, уходящая далеко в Балтийское море. Ширина местами меньше 300 метров: в некоторых точках видно воду с обеих сторон одновременно."
                  - paragraph [ref=f5e1547]: "На косе нанизаны городки: Владыславово, Халупы, Кузница, Ястарня, Юрата и Хель на самом кончике. С одной стороны — открытая Балтика с волной и ветром, с другой — спокойный Пуцкий залив, из-за чего это одно из главных мест кайт- и виндсёрфинга в Польше."
                  - paragraph [ref=f5e1549]:
                    - 'img "Песчаная оконечность косы: море с двух сторон" [ref=f5e1550]'
                  - 'heading "Розеве: два маяка на одном мысу" [level=3] [ref=f5e1551]'
                  - paragraph [ref=f5e1552]:
                    - text: Мы начали не с самой косы, а с мыса
                    - strong [ref=f5e1553]: Розеве
                    - text: перед ней — и правильно сделали. Здесь на одном участке стоят сразу два маяка.
                  - paragraph [ref=f5e1554]:
                    - strong [ref=f5e1555]: Розеве I
                    - text: — действующий, работает с 1822 года и считается старейшим действующим маяком польского побережья. Внутри — музей маячного дела, наверху — смотровая площадка.
                  - paragraph [ref=f5e1557]:
                    - img "Маяк Розеве I и дом смотрителя" [ref=f5e1558]
                  - paragraph [ref=f5e1559]:
                    - strong [ref=f5e1560]: Розеве II
                    - text: ", «Старый», построен в конце XIX века: два маяка нужны были, чтобы моряки различали мыс по двум огням. В 1978 году его погасили, а недавно вернули исторический вид — теперь это белая приземистая башня с красной галереей."
                  - paragraph [ref=f5e1562]:
                    - img "Маяк Розеве II — белая башня с красной галереей" [ref=f5e1563]
                  - paragraph [ref=f5e1564]: "Мыс Розеве долго считали самой северной точкой Польши — пока измерения не показали, что чуть севернее лежит Ястшембя-Гура. Табличку, впрочем, никто не убрал, и место от этого хуже не стало: обрывистый берег, сосны и пустой пляж внизу."
                  - paragraph [ref=f5e1565]:
                    - text: "С маяком связана литературная история: в домике смотрителя жил и работал"
                    - strong [ref=f5e1566]: Стефан Жеромский
                    - text: ", и маяк Розеве носит его имя."
                  - paragraph [ref=f5e1568]:
                    - img "Пляж Балтики с навигационной вышкой на горизонте" [ref=f5e1569]
                  - heading "Маяк в Ястарне" [level=3] [ref=f5e1570]
                  - paragraph [ref=f5e1571]: "Следующая остановка — Ястарня, небольшой курортный городок с рыбацким портом. Маяк здесь не такой известный, как Хельский, и именно в этом его прелесть: ни толп, ни суеты."
                  - paragraph [ref=f5e1572]: Сам маяк маленький, красно-белый, стоит среди сосен в двух шагах от пляжа — его легко проехать мимо. Мы приехали ранним утром, воздух пах соснами и морем, солнце только пробивалось сквозь деревья.
                  - paragraph [ref=f5e1574]:
                    - img "Красно-белый маяк в Ястарне среди сосен" [ref=f5e1575]
                  - paragraph [ref=f5e1576]: "Отсюда до воды пара минут: тропинка выходит между дюнами прямо к морю мимо закрытых до сезона киосков с надписями «Hot-dogi. Napoje. Zapiekanki» — в апреле они выглядят как декорация."
                  - paragraph [ref=f5e1578]:
                    - img "Закрытый до сезона пляжный киоск и выход к морю в Ястарне" [ref=f5e1579]
                  - heading "Хельский маяк и сосновый бор" [level=3] [ref=f5e1580]
                  - paragraph [ref=f5e1581]:
                    - text: Финал маршрута — главный символ косы,
                    - strong [ref=f5e1582]: Хельский маяк
                    - text: . Высокая красная башня видна издалека. Современный маяк построен в 1942 году (предыдущий разрушили во время Второй мировой), высота башни около 41,5 метра, а дальность света — более 18 морских миль. В сезон наверх пускают, и оттуда видно всю оконечность косы.
                  - generic [ref=f5e1583]:
                    - paragraph [ref=f5e1584]:
                      - img "Хельский маяк — красная башня высотой 41,5 метра" [ref=f5e1585]
                    - paragraph [ref=f5e1586]:
                      - img "Информационный щит «Latarnia morska HEL»" [ref=f5e1587]
                  - paragraph [ref=f5e1588]: "Вокруг маяка — старый сосновый бор. Это отдельная причина сюда приехать: деревья вывернуты ветром, песок под ногами, а между стволами всё время просвечивает море."
                  - paragraph [ref=f5e1590]:
                    - img "Сосновый бор Хельской косы, вывернутый ветром" [ref=f5e1591]
                  - heading "Оконечность косы и пустой пляж" [level=3] [ref=f5e1592]
                  - paragraph [ref=f5e1593]:
                    - text: От маяка тропинки выводят на пляж, и дальше можно идти до самой оконечности —
                    - strong [ref=f5e1594]: Cypel Helski
                    - text: . В апреле это несколько километров абсолютно пустого песка.
                  - generic [ref=f5e1595]:
                    - paragraph [ref=f5e1596]:
                      - img "На пляже Хельской косы в апреле" [ref=f5e1597]
                    - paragraph [ref=f5e1598]:
                      - img "Шалаш из плавника на пляже" [ref=f5e1599]
                  - 'heading "Крепость Хель: бункеры в лесу" [level=3] [ref=f5e1600]'
                  - paragraph [ref=f5e1601]:
                    - text: Того, чего мы совсем не ожидали, оказалось больше всего. Вся оконечность косы — это бывший
                    - strong [ref=f5e1602]: Укреплённый район Хель
                    - text: ", и лес здесь буквально нашпигован бетоном: капониры, погреба, кольца орудийных оснований, окопы."
                  - paragraph [ref=f5e1604]:
                    - img "Бетонный бункер с кольцом орудийного основания в лесу Хеля" [ref=f5e1605]
                  - paragraph [ref=f5e1606]:
                    - text: "Хель держался дольше всех в сентябре 1939 года: гарнизон капитулировал только"
                    - strong [ref=f5e1607]: 2 октября
                    - text: ", последним из польских частей. Часть сооружений сегодня — музей, часть просто стоит в лесу, и к ним ведут промаркированные тропы: синяя — «Wokół Helskich Fortyfikacji», коричневая — к батарее противодесантной обороны. Карты стоят на щитах прямо в лесу."
                  - paragraph [ref=f5e1609]:
                    - img "Щит с картой троп по фортификациям Хеля" [ref=f5e1610]
                  - heading "Маяк Гора Шведов" [level=3] [ref=f5e1611]
                  - paragraph [ref=f5e1612]:
                    - text: Самое странное место косы — маяк
                    - strong [ref=f5e1613]: Гора Шведов
                    - text: (Latarnia Morska Góra Szwedów). К нему идёшь по дюнам через низкий сосняк и можжевельник, и вдруг из песка вырастает ржавая металлическая вышка на бетонном основании, расписанная граффити.
                  - paragraph [ref=f5e1615]:
                    - img "Маяк Гора Шведов — ржавая вышка на дюне" [ref=f5e1616]
                  - paragraph [ref=f5e1617]: Это вспомогательный навигационный знак, а не «настоящий» маяк, и выглядит он совершенно заброшенным — при этом стоит на самой высокой дюне косы. Название местные связывают со шведскими войсками, которые стояли здесь во время старых кампаний, или с дозором, наблюдавшим отсюда за морем.
                  - paragraph [ref=f5e1618]: Именно тут муж сказал, что это лучший подарок за последние годы.
                  - heading "Город Хель вечером" [level=3] [ref=f5e1619]
                  - paragraph [ref=f5e1620]:
                    - text: Сам Хель маленький, и вечером, когда автобусы уезжают, он становится очень уютным. Главная улица —
                    - strong [ref=f5e1621]: Wiejska
                    - text: — застроена деревянными и фахверковыми рыбацкими домами XIX века.
                  - paragraph [ref=f5e1623]:
                    - img "Улица Wiejska в Хеле с рыбацкими домами" [ref=f5e1624]
                  - paragraph [ref=f5e1625]:
                    - text: На набережной стоит Нептун, а рядом — краснокирпичная готическая церковь святых Петра и Павла, в которой теперь
                    - strong [ref=f5e1626]: Музей рыболовства
                    - text: ": на его башню тоже можно подняться."
                  - paragraph [ref=f5e1628]:
                    - 'img "Набережная Хеля: Нептун и Музей рыболовства в бывшей церкви" [ref=f5e1629]'
                  - paragraph [ref=f5e1630]: "Ужинали мы здесь же, рыбой — на косе это обязательная программа. Ищите вывеску «smażalnia ryb»: это не ресторан, а жарильня, где рыбу берут по весу, и именно там она самая свежая. Дорогу домой мы досматривали уже на закате."
                  - paragraph [ref=f5e1632]:
                    - img "Закат над полями по дороге с косы" [ref=f5e1633]
                  - heading "Легенды Хельской косы" [level=2] [ref=f5e1634]
                  - paragraph [ref=f5e1635]: Старые моряки рассказывали, что в сильный туман у косы слышны «голоса моря» — будто души погибших рыбаков предупреждают живых об опасности. А свет маяков, по преданию, не раз спасал корабли в последние минуты перед катастрофой — потому маячников здесь уважали почти как героев.
                  - paragraph [ref=f5e1636]: "Кашубы объясняли происхождение косы по-своему: будто её насыпал великан, чтобы дойти по морю до другого берега, да так и не закончил работу. Отсюда и форма — длинный «палец», обрывающийся на полпути."
                  - paragraph [ref=f5e1637]:
                    - text: Ещё одна местная история — про
                    - strong [ref=f5e1638]: затонувший город Хель
                    - text: ": якобы старое поселение стояло мористее нынешнего и ушло под воду вместе с костёлом, чей колокол в шторм иногда слышно с берега. Похожие легенды есть по всему южному берегу Балтики, и все они об одном: море здесь регулярно забирало сушу обратно."
                  - 'heading "Маршруты: что реально успеть" [level=2] [ref=f5e1639]'
                  - list [ref=f5e1640]:
                    - listitem [ref=f5e1641]:
                      - strong [ref=f5e1642]: Три маяка за один день на машине
                      - text: — Розеве, Ястарня, Хель. Мы сделали именно так, но выехали рано и вернулись в темноте.
                    - listitem [ref=f5e1643]:
                      - strong [ref=f5e1644]: Коса на велосипеде
                      - text: — вдоль всей косы идёт отдельная велодорожка от Владыславово до Хеля, около 35 км в одну сторону, почти без набора высоты. Один из самых красивых веломаршрутов Польши и, пожалуй, лучший способ её увидеть. Обратно можно вернуться поездом или паромом.
                    - listitem [ref=f5e1645]:
                      - strong [ref=f5e1646]: Оконечность косы пешком
                      - text: — от Хельского маяка до Cypel Helski и обратно по пляжу, 6–8 км, с заходом на тропы крепости.
                    - listitem [ref=f5e1647]:
                      - strong [ref=f5e1648]: Дюны Чолпино
                      - text: — от парковки до моря и обратно 4–5 км по бору и песку, полдня с фотоаппаратом.
                    - listitem [ref=f5e1649]:
                      - strong [ref=f5e1650]: Долина Слупи на велосипеде
                      - text: — круг 30–35 км по грунтовкам, без единого туриста.
                  - heading "Практическая информация" [level=2] [ref=f5e1651]
                  - heading "Как добраться" [level=3] [ref=f5e1652]
                  - list [ref=f5e1653]:
                    - listitem [ref=f5e1654]:
                      - strong [ref=f5e1655]: "На машине:"
                      - text: "из Гданьска до Хеля около 100 км через Владыславово, 1,5–2 часа без пробок. Летом коса стоит: въезд лучше проходить до 9 утра. Зато вне сезона дорога пустая."
                    - listitem [ref=f5e1656]:
                      - strong [ref=f5e1657]: "На поезде:"
                      - text: прямые поезда из Гданьска и Гдыни до станции Hel, около 2 часов; летом ходит сезонный «Słoneczny». Вокзал в Хеле — в десяти минутах от маяка.
                    - listitem [ref=f5e1658]:
                      - strong [ref=f5e1659]: "На пароме:"
                      - text: в сезон из Гдыни, Сопота и Гданьска в Хель ходят суда — самый приятный вариант, 1–1,5 часа по заливу.
                    - listitem [ref=f5e1660]:
                      - strong [ref=f5e1661]: "До нашей базы:"
                      - text: Кшыня — это 30 км от Слупска и около 130 км от Гданьска, то есть до косы примерно 2 часа. Если ехать только ради маяков, логичнее жить в районе Пуцка или Владыславово.
                  - heading "Когда ехать" [level=3] [ref=f5e1662]
                  - paragraph [ref=f5e1663]: "Мы были в апреле и остались очень довольны: пустые пляжи, чистый свет, никаких очередей и цены вне сезона. Минус — вода холодная, часть маяков и музеев ещё закрыта, а на ветру нужен пуховик."
                  - paragraph [ref=f5e1664]: Июль-август — это купание, все объекты открыты, но коса забита, парковки платные и дорогие, а жильё нужно бронировать за месяцы. Май-июнь и сентябрь — компромисс.
                  - heading "Деньги, парковки, мелочи" [level=3] [ref=f5e1665]
                  - list [ref=f5e1666]:
                    - listitem [ref=f5e1667]: "Наличные злотые нужны: у маяков и на мелких парковках карты принимают не везде."
                    - listitem [ref=f5e1668]: Парковки в Хеле платные, ближе к маяку дороже; бесплатные места есть на въезде в город.
                    - listitem [ref=f5e1669]: "Обувь — закрытая: песок в дюнах и бору мелкий и попадает везде."
                    - listitem [ref=f5e1670]: "Ветер на косе сильнее, чем кажется по прогнозу: на пляже всегда на несколько градусов холоднее."
                    - listitem [ref=f5e1671]: Заранее проверяйте часы работы маяков — вне сезона они открыты только по выходным или закрыты совсем.
                  - heading "Наши впечатления" [level=2] [ref=f5e1672]
                  - paragraph [ref=f5e1673]: Эта неделя оказалась намного больше, чем прогулка по маякам. Дом на озере, где утро начинается с печки и мокрых собак; лес, в котором можно ехать час и не встретить машину; дюны, где кажется, что ты первый человек на этом берегу; и один длинный день на косе, спрессовавший в себя всё сразу — маяки, бункеры, море и закат по дороге домой.
                  - paragraph [ref=f5e1674]: "Если выбирать формат, я бы советовала именно такой: снять один дом на неделю где-то в глубине Кашубии и ездить от него радиально. Так побережье открывается совсем иначе, чем из отеля в курортном городке."
