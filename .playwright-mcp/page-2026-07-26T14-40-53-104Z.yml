                  - heading "День 6. Родник в скалах и финиш в Этрета" [level=2] [ref=e1628]
                  - paragraph [ref=e1630]:
                    - img "Ступени на прибрежной тропе" [ref=e1631]
                  - paragraph [ref=e1632]: "Финальный переход — 18–20 километров, и самый большой перепад высоты за всю неделю, около 442 метров. И один из самых красивых дней: первый раз погода была по-настоящему комфортной — солнце, но не пекло."
                  - generic [ref=e1633]:
                    - paragraph [ref=e1634]:
                      - img "Вода сочится прямо из меловой скалы, поросшей мхом — тот самый родник" [ref=e1635]
                    - paragraph [ref=e1636]:
                      - img "Пляж под скалами в отлив" [ref=e1637]
                  - paragraph [ref=e1638]:
                    - text: Самое запоминающееся —
                    - strong [ref=e1639]: родник
                    - text: . С утра мы шли километра три-четыре по обнажившемуся отливом морю и дошли до места, где из белых меловых скал, поросших мхом, прямо сочится вода. Маленькая бухта, пустой пляж, ни одного человека — выглядит фантастически. На карте это отмечено как родник.
                  - paragraph [ref=e1640]: "Дальше — кофе в Ипоре (Yport) на набережной и подход к Этрета. И тут разница чувствуется остро: почти весь маршрут выходы на скалы закрыты, людей нет — а в Этрета народ сидит прямо на обрывах, хотя скалы здесь действительно обваливаются (мы своими глазами видели много свежих обвалов). Когда идёшь так целую неделю, появляется уважение к стихии: сто раз перепроверишь и приливы, и где можно стоять."
                  - paragraph [ref=e1641]: "В Этрета всё уже по-туристически просто. На набережной есть кафе, где круглые сутки подают устрицы и мидии; попробовали сидр — французский понравился (как яблочный сок, который только начал бродить), немецкий нет. Устрицы здесь оказались лучшими из всех, что мы пробовали (а пробовали и в Таллине, и в Париже). Заселил нас единственный за весь маршрут улыбчивый и доброжелательный хозяин. Номер маленький и дорогой — 360 € за двое суток, но Этрета хоть и знаменитое место, всё равно деревня. Ужин по TripAdvisor (4,6): лосось, мясо, бурата, кальвадос, десерты — около 120 € на двоих с вином и чаевыми, для курортного городка совсем неплохо."
                  - generic [ref=e1642]:
