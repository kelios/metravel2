                    - paragraph [ref=e1429]:
                      - img "Деревянный домик-ночёвка на маршруте" [ref=e1430]
                  - paragraph [ref=e1431]: "Зато ужин в ресторане был сказкой: морепродукты, мясо, первое-второе-третье, десерт — всё восхитительно."
