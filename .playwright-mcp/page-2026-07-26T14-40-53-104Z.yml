                    - img "На травянистом склоне над морем" [ref=e1425]
                    - text: "Ночевали в кемпинге — единственное, что нашлось на эти даты: домик за 200 €. Не шикарный, но заселяют почти до 11 вечера."
                  - generic [ref=e1426]:
