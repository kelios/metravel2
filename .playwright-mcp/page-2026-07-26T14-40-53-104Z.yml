                      - img "Дорога в тенистой ложбине между живыми изгородями" [ref=e1588]
                    - paragraph [ref=e1589]:
                      - img "Нормандский фахверковый дом под соломенной крышей" [ref=e1590]
                  - generic [ref=e1591]:
                    - paragraph [ref=e1592]:
                      - img "Старые кирпичные ворота и указатель GR 21" [ref=e1593]
                    - paragraph [ref=e1594]:
                      - img "Колокольня деревенской церкви над изгородью" [ref=e1595]
                  - generic [ref=e1596]:
                    - paragraph [ref=e1597]:
                      - img "Посёлок в бухте и меловой мыс с высоты тропы" [ref=e1598]
                    - paragraph [ref=e1599]:
                      - img "Закат с террасы ночёвки" [ref=e1600]
                  - heading "День 5. Кролики, поля и Фекан" [level=2] [ref=e1601]
                  - paragraph [ref=e1603]:
                    - img "Улица Фекана" [ref=e1604]
                  - paragraph [ref=e1605]: "Шли в основном по открытым утёсам. Самое милое — кролики: на участке у края скал, где старые дома и территория выселены, теперь живут сотни кроликов с норками. Появился ветер, собиралась гроза (но так и не случилась). Дошли к полудню, около двадцати километров. Заселение здесь по-божески — с 15:30, самая дешёвая двухзвёздочная гостиница почти на первой линии, снова старинный дом с винтовой лестницей."
                  - paragraph [ref=e1606]:
                    - text: А вечером —
                    - strong [ref=e1607]: Фекан (Fécamp)
                    - text: ", просто восхитительный: замок, церкви. Здесь стоит попробовать знаменитый ликёр Бенедиктин по старинным рецептам, кальвадос и рыбу. Мы заказали ската, утку, тартар, салат с козьим сыром и два десерта — нормандский с кальвадосом и крем-брюле с бенедиктином. Восхитительный день."
                  - generic [ref=e1608]:
                    - paragraph [ref=e1609]:
                      - img "Корова на тропе — обычный попутчик на нормандских полях" [ref=e1610]
                    - paragraph [ref=e1611]:
                      - img "Тропа через пшеничное поле" [ref=e1612]
                  - generic [ref=e1613]:
