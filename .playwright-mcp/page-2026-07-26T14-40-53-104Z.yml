                  - paragraph [ref=e1556]
                  - paragraph [ref=e1557]: "По красоте день спорный: последние десять километров мы практически всё время обходили атомную станцию, местами прямо вдоль трассы по высокой траве. Тяжело, но без вчерашней влажности — чуть легче. Зато в большом городке по пути попробовали мидии — вот это был восторг (после консервированных - небо и земля)."
                  - generic [ref=e1558]:
                    - paragraph [ref=e1559]:
                      - img "Кастрюля мидий с картофелем фри" [ref=e1560]
                    - paragraph [ref=e1561]:
                      - img "Салат с мясной нарезкой" [ref=e1562]
                    - paragraph [ref=e1563]:
                      - img "Тропа через поля" [ref=e1564]
                  - paragraph [ref=e1566]:
                    - img "Путник на тропе в зелени" [ref=e1567]
                  - generic [ref=e1568]:
                    - paragraph [ref=e1569]:
                      - img "Селфи вдвоём после долгого перехода" [ref=e1570]
                    - paragraph [ref=e1571]:
                      - img "Путник на широкой грунтовой дороге" [ref=e1572]
                  - paragraph [ref=e1573]:
                    - text: "Ночевали в старинном шале с огромным парком прямо напротив атомной станции: винтовая лестница, комната под крышей за 100 €, душ и туалет общие. Чисто и аккуратно, но без кондиционера в такую жару комната не проветривалась совсем."
                    - img "Усадьба-гостиница за оградой" [ref=e1574]
                  - paragraph [ref=e1576]:
                    - img "Лестница с красной ковровой дорожкой" [ref=e1577]
                  - paragraph [ref=e1578]
                  - heading "День 4. Лес, деревни и сарайчик в плесени" [level=2] [ref=e1579]
                  - paragraph [ref=e1580]: "Пожалуй, самый приятный день: дорога почти всё время шла лесами, с парой красивых бухтовых долин. Минус — негде было поесть: магазины есть, ресторанов нет, обошлись бананами из магазина. День жаркий, за тридцать, но в лесу терпимо; к трём завалились на пляж. Ночёвка — снова «сарайчик» за 200 €, как старый автодом: душно и весь в плесени (потолок, двери) — в этом регионе с влажностью это обычное дело. В соседнем кемпинге был бассейн и «тарелки» (сыр, колбаса, вино, мороженое) — пиццу, правда, в этот день не делали."
                  - generic [ref=e1581]:
                    - paragraph [ref=e1582]:
                      - img "Тропа GR21 через ячменные поля над морем" [ref=e1583]
                    - paragraph [ref=e1584]:
                      - img "Лесная тропа в зелёном свете — почти весь день шли лесами" [ref=e1585]
                  - generic [ref=e1586]:
