                  - paragraph [ref=e1473]: "За пару километров до финиша мы совершили роковую ошибку — поднялись по лестнице на плато и пошли поверху, по полю. Это как идти в парнике: жарит снизу, жарит сверху, тени нет совсем, солнце ровно над головой. Эти 2,5 километра дались тяжелее всего."
