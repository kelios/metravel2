                  - paragraph [ref=e1441]
                  - paragraph [ref=e1442]: Пятнадцать километров и экстремальная жара. Воду пришлось искать с утра в центре городка (заправка, почта, магазин, бар) и идти решили по берегу, чтобы не тащиться по раскалённым полям.
                  - generic [ref=e1443]:
                    - paragraph [ref=e1444]:
                      - img "Закат над морем с террасы" [ref=e1445]
                    - paragraph [ref=e1446]:
                      - img "Завтрак под навесом" [ref=e1447]
                  - paragraph [ref=e1448]:
                    - text: "И тут — важнейший совет:"
                    - strong [ref=e1449]: обязательно сверяйте время приливов и отливов.
                    - text: "Есть сайты, где это легко проверить, и делать это нужно всегда: вода прибывает очень быстро, и без проверки можно попасть в беду. Зато идти по обнажившемуся дну невероятно интересно — красивые камни, ракушки, устрицы, и у моря всегда лёгкий бриз. К скалам близко не подходите: сверху периодически осыпаются камни."
