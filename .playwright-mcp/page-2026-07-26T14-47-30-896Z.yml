                - 'button "Хельская коса: маяк в В Ястарне - Маяк Гора-Шведов - Хельский маяк, развёрнуто" [expanded] [ref=f5e227] [cursor=pointer]':
                  - generic [ref=f5e228]:
                    - 'img "Хельская коса: маяк в В Ястарне - Маяк Гора-Шведов - Хельский маяк" [ref=f5e231]'
                    - generic [ref=f5e232]: "Хельская коса: маяк в В Ястарне - Маяк Гора-Шведов - Хельский маяк"
                - generic [ref=f5e237]:
                  - generic [ref=f5e238]: "лучший сезон: апрель · ~14 мин чтения"
                  - heading "Содержание маршрута" [level=2] [ref=f5e240]
                  - generic [ref=f5e244]:
                    - paragraph [ref=f5e245]: "Мы прожили неделю на польской Балтике в апреле — сняли дом на озере в Кашубии и оттуда каждый день уезжали в новую сторону. Главным днём стал день рождения мужа: мы проехали почти всю Хельскую косу и посмотрели три маяка — в Ястарне, Гору Шведов и Хельский. Но неделя оказалась намного шире одного маршрута, поэтому здесь всё: где мы жили с двумя собаками, что смотреть вокруг, дюны Словинского парка, крепость Хеля и как всё это связать в поездку."
                    - paragraph [ref=f5e247]:
                      - img "Пустой пляж Хельской косы под перистыми облаками" [ref=f5e248]
                    - 'heading "Кратко: маршрут недели" [level=2] [ref=f5e249]'
                    - paragraph [ref=f5e250]: Апрель, семь ночей, база — один дом, из которого удобно ездить в обе стороны побережья.
                    - list [ref=f5e251]:
                      - listitem [ref=f5e252]:
                        - strong [ref=f5e253]: День 1.
                        - text: Заезд, дом на озере в Кшыне (Krzynia), гмина Дембница-Кашубска — 30 км от Слупска.
                      - listitem [ref=f5e254]:
                        - strong [ref=f5e255]: День 2.
                        - text: "Велопрогулка по ландшафтному парку «Долина Слупи»: аллеи, река, бобровые разливы."
                      - listitem [ref=f5e256]:
                        - strong [ref=f5e257]: День 3.
                        - text: Словинский национальный парк, дюны Чолпино и пустой апрельский пляж.
                      - listitem [ref=f5e258]:
                        - strong [ref=f5e259]: День 4.
                        - text: Отдых у дома, озеро, костёр, прогулки с собаками.
                      - listitem [ref=f5e260]:
                        - strong [ref=f5e261]: День 5.
                        - text: "Хельская коса: маяки Розеве, Ястарня, Хель, крепость и Гора Шведов — с раннего утра до заката."
                      - listitem [ref=f5e262]:
                        - strong [ref=f5e263]: Дни 6–7.
                        - text: Окрестности, второй заход на пляж, дорога домой.
                    - paragraph [ref=f5e264]: "Если у вас не неделя, а выходные — берите день на Хельскую косу и день на Словинский парк, а ночевать лучше не на самой косе: в глубине Кашубии дешевле, тише и есть куда выпустить собак."
                    - 'heading "Где мы жили: дом на озере в Кашубии" [level=2] [ref=f5e265]'
                    - paragraph [ref=f5e266]:
                      - text: Мы искали жильё под простое условие —
                      - strong [ref=f5e267]: две собаки
                      - text: ", свой участок и никакого «тихого часа» с соседями за стеной. В итоге сняли дом на берегу озера в деревне"
                      - strong [ref=f5e268]: Кшыня (Krzynia)
                      - text: ", гмина Дембница-Кашубска, Слупский повят."
                    - paragraph [ref=f5e269]: "Дом — современный барн-хаус: тёмный фасад, крытая терраса, панорамные окна во всю стену и чугунная печь, которую в апреле топишь каждый вечер. За окном — лес и вода, до берега двести метров."
                    - generic [ref=f5e270]:
                      - paragraph [ref=f5e271]:
                        - img "Дом-барнхаус с крытой террасой на берегу озера в Кшыне" [ref=f5e272]
                      - paragraph [ref=f5e273]:
                        - img "Чугунная печь и дрова в гостиной дома" [ref=f5e274]
                    - paragraph [ref=f5e275]: "Утро выглядело так: печь, кофе, панорамное окно и озеро, которое в безветрие превращается в зеркало."
                    - generic [ref=f5e276]:
                      - paragraph [ref=f5e277]:
                        - img "Завтрак за столом у панорамного окна с видом на лес" [ref=f5e278]
                      - paragraph [ref=f5e279]:
                        - 'img "Озеро Кшыня в безветрие: вода как зеркало" [ref=f5e280]'
                    - paragraph [ref=f5e281]: К воде ведут деревянные мостки — главное место дома. Мы выходили туда на рассвете и на закате, и оба раза это было лучше любой смотровой площадки.
                    - generic [ref=f5e282]:
                      - paragraph [ref=f5e283]:
                        - img "Деревянные мостки над озером на закате" [ref=f5e284]
                      - paragraph [ref=f5e285]:
                        - img "Мостки над озером с собакой в утреннем солнце" [ref=f5e286]
                    - heading "Про собак — что важно знать заранее" [level=3] [ref=f5e287]
                    - paragraph [ref=f5e288]: "Ехать на Балтику с собаками в апреле — отличная идея: пляжи пустые, ограничения высокого сезона не действуют, а вода уже достаточно тёплая, чтобы пёс лез в неё сам."
                    - generic [ref=f5e289]:
                      - paragraph [ref=f5e290]:
                        - img "Собака у чугунной печи в доме" [ref=f5e291]
                      - paragraph [ref=f5e292]:
                        - img "Собака спит на ковре у печки" [ref=f5e293]
                    - paragraph [ref=f5e294]: "Что мы вынесли из недели:"
                    - list [ref=f5e295]:
                      - listitem [ref=f5e296]:
                        - strong [ref=f5e297]: Ищите дом с участком, а не квартиру.
                        - text: В Польше много объектов с пометкой «przyjazny zwierzętom» / «pies mile widziany», но у части из них это значит «можно, если маленькая». Уточняйте размер и количество.
                      - listitem [ref=f5e298]:
                        - strong [ref=f5e299]: Спрашивайте про забор.
                        - text: "Огороженный участок меняет всю поездку: собак можно просто выпустить."
                      - listitem [ref=f5e300]:
                        - strong [ref=f5e301]: Берите свои миски, лежанку и старое полотенце.
                        - text: После озера пёс приходит мокрый и в песке, а хозяйские полотенца для этого не предназначены.
                      - listitem [ref=f5e302]:
                        - strong [ref=f5e303]: На пляжах смотрите таблички.
                        - text: В сезон на охраняемых участках собаки запрещены, но вне сезона и на «диких» отрезках косы и Словинского парка проблем нет.
                      - listitem [ref=f5e304]:
                        - strong [ref=f5e305]: В нацпарке собака — только на поводке.
                        - text: Это правило, а не рекомендация.
                    - paragraph [ref=f5e307]:
                      - img "Собаки купаются в озере у берега" [ref=f5e308]
                    - paragraph [ref=f5e309]:
                      - text: Само озеро в Кшыне — не природное, а
                      - strong [ref=f5e310]: водохранилище на реке Слупя
                      - text: ". Чуть выше по дороге стоит старая гидроэлектростанция 1920-х годов: именно её плотина и создала эту воду. Такие маленькие ГЭС на Слупи — местная особенность, их тут целый каскад."
                    - paragraph [ref=f5e312]:
                      - img "Старая гидроэлектростанция 1920-х годов на реке Слупя" [ref=f5e313]
                    - 'heading "Что смотреть вокруг: ландшафтный парк «Долина Слупи»" [level=2] [ref=f5e314]'
                    - paragraph [ref=f5e315]:
                      - text: "Мы не сразу поняли, как нам повезло с местом: дом стоит внутри ландшафтного парка"
                      - strong [ref=f5e316]: «Dolina Słupi»
                      - text: . Это не громкая достопримечательность, а именно та Польша, ради которой стоит снимать дом на неделю, а не отель на две ночи.
                    - paragraph [ref=f5e317]: "Один день мы просто взяли велосипеды и поехали куда глаза глядят. Дороги здесь двух видов: старые брусчатые аллеи между вековыми деревьями и грунтовки через поля."
                    - generic [ref=f5e318]:
                      - paragraph [ref=f5e319]:
                        - img "Велосипед на старой брусчатой аллее между деревьями" [ref=f5e320]
                      - paragraph [ref=f5e321]:
                        - img "Велосипед в поле у аллеи вековых деревьев" [ref=f5e322]
                    - paragraph [ref=f5e323]: По пути — пастбища с коровами, которых тут выпускают на весь тёплый сезон, и полное отсутствие машин.
                    - paragraph [ref=f5e325]:
                      - img "Пастбище со стадом в ландшафтном парке «Долина Слупи»" [ref=f5e326]
                    - paragraph [ref=f5e327]:
                      - text: Главная героиня парка — сама
                      - strong [ref=f5e328]: Слупя
                      - text: ": быстрая, чистая, петляющая река, знаменитая тем, что в неё заходит на нерест лосось. Вдоль неё идут тропы, а рядом видно работу бобров — целые разливы с затопленным лесом."
                    - generic [ref=f5e329]:
                      - paragraph [ref=f5e330]:
                        - img "Река Слупя в тростнике" [ref=f5e331]
                      - paragraph [ref=f5e332]:
                        - img "Бобровые разливы с затопленным лесом" [ref=f5e333]
                    - paragraph [ref=f5e334]:
                      - strong [ref=f5e335]: "Маршрут на день:"
                      - text: Кшыня — Зaклодно — Дембница-Кашубска — Желькувко и обратно, около 30–35 км по кругу, почти всё по грунтовкам и лесным дорогам, набор высоты небольшой. Годится и для обычного гибрида.
                    - 'heading "Словинский национальный парк: дюны Чолпино" [level=2] [ref=f5e336]'
                    - paragraph [ref=f5e337]:
                      - text: За дюнами обычно едут в Лебу, но мы пошли с другой стороны — от деревни
                      - strong [ref=f5e338]: Чолпино (Czołpino)
                      - text: . Там меньше людей, и дюна выходит прямо к морю.
                    - paragraph [ref=f5e339]: От парковки к морю ведёт длинная сосновая аллея — километра полтора идеально прямой дороги в бору.
                    - paragraph [ref=f5e341]:
                      - img "Прямая сосновая аллея от парковки Чолпино к морю" [ref=f5e342]
                    - paragraph [ref=f5e343]: "А потом лес заканчивается, и начинается белое: подвижные дюны, редкие сосны, вывернутые ветром, и ни одного человека в кадре."
                    - generic [ref=f5e344]:
                      - paragraph [ref=f5e345]:
                        - img "Белая подвижная дюна с соснами в Словинском парке" [ref=f5e346]
                      - paragraph [ref=f5e347]:
                        - img "Человек на гребне дюны Чолпино" [ref=f5e348]
                    - paragraph [ref=f5e349]: Дальше — пляж. В апреле он выглядит так, будто вы первые, кто на него вышел.
                    - generic [ref=f5e350]:
                      - paragraph [ref=f5e351]:
                        - img "Пустой апрельский пляж Балтики у Чолпино" [ref=f5e352]
                      - paragraph [ref=f5e353]:
                        - img "На пляже Словинского парка в апреле" [ref=f5e354]
                    - paragraph [ref=f5e355]: В дюнах прячутся бетонные руины — остатки военных сооружений, которые уже наполовину съел песок. Это не «достопримечательность», их нет в путеводителях, но они очень хорошо объясняют, что это за берег.
                    - paragraph [ref=f5e357]:
                      - img "Бетонные военные руины, наполовину занесённые песком" [ref=f5e358]
                    - paragraph [ref=f5e359]:
                      - text: Рядом стоит
                      - strong [ref=f5e360]: маяк Чолпино
                      - text: — он спрятан в лесу на дюне, на высоте около 55 метров над уровнем моря, поэтому сама башня невысокая, а свет виден далеко. Подъём наверх открыт в сезон.
                    - paragraph [ref=f5e361]:
                      - text: "Подробнее про парк, знаменитые «ходячие» дюны у Лебы и практические детали — в отдельной статье:"
                      - link "Словинский национальный парк" [ref=f5e362] [cursor=pointer]:
                        - /url: https://metravel.by/travels/slovinskiy-nacionalnyy-park-slupsk
                      - text: .
                    - heading "День маяков на Хельской косе" [level=2] [ref=f5e363]
                    - paragraph [ref=f5e364]: "Это был день рождения мужа, и он сам выбрал программу: проехать косу и собрать маяки. Вышло около 12 часов в дороге и на ногах — и это лучший день недели."
                    - heading "Где находится Хельская коса" [level=3] [ref=f5e365]
                    - paragraph [ref=f5e366]: "Хельская коса — узкая песчаная полоса длиной около 35 км на севере Польши, в Поморском воеводстве, уходящая далеко в Балтийское море. Ширина местами меньше 300 метров: в некоторых точках видно воду с обеих сторон одновременно."
                    - paragraph [ref=f5e367]: "На косе нанизаны городки: Владыславово, Халупы, Кузница, Ястарня, Юрата и Хель на самом кончике. С одной стороны — открытая Балтика с волной и ветром, с другой — спокойный Пуцкий залив, из-за чего это одно из главных мест кайт- и виндсёрфинга в Польше."
                    - paragraph [ref=f5e369]:
                      - 'img "Песчаная оконечность косы: море с двух сторон" [ref=f5e370]'
                    - 'heading "Розеве: два маяка на одном мысу" [level=3] [ref=f5e371]'
                    - paragraph [ref=f5e372]:
                      - text: Мы начали не с самой косы, а с мыса
                      - strong [ref=f5e373]: Розеве
                      - text: перед ней — и правильно сделали. Здесь на одном участке стоят сразу два маяка.
                    - paragraph [ref=f5e374]:
                      - strong [ref=f5e375]: Розеве I
                      - text: — действующий, работает с 1822 года и считается старейшим действующим маяком польского побережья. Внутри — музей маячного дела, наверху — смотровая площадка.
                    - paragraph [ref=f5e377]:
                      - img "Маяк Розеве I и дом смотрителя" [ref=f5e378]
                    - paragraph [ref=f5e379]:
                      - strong [ref=f5e380]: Розеве II
                      - text: ", «Старый», построен в конце XIX века: два маяка нужны были, чтобы моряки различали мыс по двум огням. В 1978 году его погасили, а недавно вернули исторический вид — теперь это белая приземистая башня с красной галереей."
                    - paragraph [ref=f5e382]:
                      - img "Маяк Розеве II — белая башня с красной галереей" [ref=f5e383]
                    - paragraph [ref=f5e384]: "Мыс Розеве долго считали самой северной точкой Польши — пока измерения не показали, что чуть севернее лежит Ястшембя-Гура. Табличку, впрочем, никто не убрал, и место от этого хуже не стало: обрывистый берег, сосны и пустой пляж внизу."
                    - paragraph [ref=f5e385]:
                      - text: "С маяком связана литературная история: в домике смотрителя жил и работал"
                      - strong [ref=f5e386]: Стефан Жеромский
                      - text: ", и маяк Розеве носит его имя."
                    - paragraph [ref=f5e388]:
                      - img "Пляж Балтики с навигационной вышкой на горизонте" [ref=f5e389]
                    - heading "Маяк в Ястарне" [level=3] [ref=f5e390]
                    - paragraph [ref=f5e391]: "Следующая остановка — Ястарня, небольшой курортный городок с рыбацким портом. Маяк здесь не такой известный, как Хельский, и именно в этом его прелесть: ни толп, ни суеты."
                    - paragraph [ref=f5e392]: Сам маяк маленький, красно-белый, стоит среди сосен в двух шагах от пляжа — его легко проехать мимо. Мы приехали ранним утром, воздух пах соснами и морем, солнце только пробивалось сквозь деревья.
                    - paragraph [ref=f5e394]:
                      - img "Красно-белый маяк в Ястарне среди сосен" [ref=f5e395]
                    - paragraph [ref=f5e396]: "Отсюда до воды пара минут: тропинка выходит между дюнами прямо к морю мимо закрытых до сезона киосков с надписями «Hot-dogi. Napoje. Zapiekanki» — в апреле они выглядят как декорация."
                    - paragraph [ref=f5e398]:
                      - img "Закрытый до сезона пляжный киоск и выход к морю в Ястарне" [ref=f5e399]
                    - heading "Хельский маяк и сосновый бор" [level=3] [ref=f5e400]
                    - paragraph [ref=f5e401]:
                      - text: Финал маршрута — главный символ косы,
                      - strong [ref=f5e402]: Хельский маяк
                      - text: . Высокая красная башня видна издалека. Современный маяк построен в 1942 году (предыдущий разрушили во время Второй мировой), высота башни около 41,5 метра, а дальность света — более 18 морских миль. В сезон наверх пускают, и оттуда видно всю оконечность косы.
                    - generic [ref=f5e403]:
                      - paragraph [ref=f5e404]:
                        - img "Хельский маяк — красная башня высотой 41,5 метра" [ref=f5e405]
                      - paragraph [ref=f5e406]:
                        - img "Информационный щит «Latarnia morska HEL»" [ref=f5e407]
                    - paragraph [ref=f5e408]: "Вокруг маяка — старый сосновый бор. Это отдельная причина сюда приехать: деревья вывернуты ветром, песок под ногами, а между стволами всё время просвечивает море."
                    - paragraph [ref=f5e410]:
                      - img "Сосновый бор Хельской косы, вывернутый ветром" [ref=f5e411]
                    - heading "Оконечность косы и пустой пляж" [level=3] [ref=f5e412]
                    - paragraph [ref=f5e413]:
                      - text: От маяка тропинки выводят на пляж, и дальше можно идти до самой оконечности —
                      - strong [ref=f5e414]: Cypel Helski
                      - text: . В апреле это несколько километров абсолютно пустого песка.
                    - generic [ref=f5e415]:
                      - paragraph [ref=f5e416]:
                        - img "На пляже Хельской косы в апреле" [ref=f5e417]
                      - paragraph [ref=f5e418]:
                        - img "Шалаш из плавника на пляже" [ref=f5e419]
                    - 'heading "Крепость Хель: бункеры в лесу" [level=3] [ref=f5e420]'
                    - paragraph [ref=f5e421]:
                      - text: Того, чего мы совсем не ожидали, оказалось больше всего. Вся оконечность косы — это бывший
                      - strong [ref=f5e422]: Укреплённый район Хель
                      - text: ", и лес здесь буквально нашпигован бетоном: капониры, погреба, кольца орудийных оснований, окопы."
                    - paragraph [ref=f5e424]:
                      - img "Бетонный бункер с кольцом орудийного основания в лесу Хеля" [ref=f5e425]
                    - paragraph [ref=f5e426]:
                      - text: "Хель держался дольше всех в сентябре 1939 года: гарнизон капитулировал только"
                      - strong [ref=f5e427]: 2 октября
                      - text: ", последним из польских частей. Часть сооружений сегодня — музей, часть просто стоит в лесу, и к ним ведут промаркированные тропы: синяя — «Wokół Helskich Fortyfikacji», коричневая — к батарее противодесантной обороны. Карты стоят на щитах прямо в лесу."
                    - paragraph [ref=f5e429]:
                      - img "Щит с картой троп по фортификациям Хеля" [ref=f5e430]
                    - heading "Маяк Гора Шведов" [level=3] [ref=f5e431]
                    - paragraph [ref=f5e432]:
                      - text: Самое странное место косы — маяк
                      - strong [ref=f5e433]: Гора Шведов
                      - text: (Latarnia Morska Góra Szwedów). К нему идёшь по дюнам через низкий сосняк и можжевельник, и вдруг из песка вырастает ржавая металлическая вышка на бетонном основании, расписанная граффити.
                    - paragraph [ref=f5e435]:
                      - img "Маяк Гора Шведов — ржавая вышка на дюне" [ref=f5e436]
                    - paragraph [ref=f5e437]: Это вспомогательный навигационный знак, а не «настоящий» маяк, и выглядит он совершенно заброшенным — при этом стоит на самой высокой дюне косы. Название местные связывают со шведскими войсками, которые стояли здесь во время старых кампаний, или с дозором, наблюдавшим отсюда за морем.
                    - paragraph [ref=f5e438]: Именно тут муж сказал, что это лучший подарок за последние годы.
                    - heading "Город Хель вечером" [level=3] [ref=f5e439]
                    - paragraph [ref=f5e440]:
                      - text: Сам Хель маленький, и вечером, когда автобусы уезжают, он становится очень уютным. Главная улица —
                      - strong [ref=f5e441]: Wiejska
                      - text: — застроена деревянными и фахверковыми рыбацкими домами XIX века.
                    - paragraph [ref=f5e443]:
                      - img "Улица Wiejska в Хеле с рыбацкими домами" [ref=f5e444]
                    - paragraph [ref=f5e445]:
                      - text: На набережной стоит Нептун, а рядом — краснокирпичная готическая церковь святых Петра и Павла, в которой теперь
                      - strong [ref=f5e446]: Музей рыболовства
                      - text: ": на его башню тоже можно подняться."
                    - paragraph [ref=f5e448]:
                      - 'img "Набережная Хеля: Нептун и Музей рыболовства в бывшей церкви" [ref=f5e449]'
                    - paragraph [ref=f5e450]: "Ужинали мы здесь же, рыбой — на косе это обязательная программа. Ищите вывеску «smażalnia ryb»: это не ресторан, а жарильня, где рыбу берут по весу, и именно там она самая свежая. Дорогу домой мы досматривали уже на закате."
                    - paragraph [ref=f5e452]:
                      - img "Закат над полями по дороге с косы" [ref=f5e453]
                    - heading "Легенды Хельской косы" [level=2] [ref=f5e454]
                    - paragraph [ref=f5e455]: Старые моряки рассказывали, что в сильный туман у косы слышны «голоса моря» — будто души погибших рыбаков предупреждают живых об опасности. А свет маяков, по преданию, не раз спасал корабли в последние минуты перед катастрофой — потому маячников здесь уважали почти как героев.
                    - paragraph [ref=f5e456]: "Кашубы объясняли происхождение косы по-своему: будто её насыпал великан, чтобы дойти по морю до другого берега, да так и не закончил работу. Отсюда и форма — длинный «палец», обрывающийся на полпути."
                    - paragraph [ref=f5e457]:
                      - text: Ещё одна местная история — про
                      - strong [ref=f5e458]: затонувший город Хель
                      - text: ": якобы старое поселение стояло мористее нынешнего и ушло под воду вместе с костёлом, чей колокол в шторм иногда слышно с берега. Похожие легенды есть по всему южному берегу Балтики, и все они об одном: море здесь регулярно забирало сушу обратно."
                    - 'heading "Маршруты: что реально успеть" [level=2] [ref=f5e459]'
                    - list [ref=f5e460]:
                      - listitem [ref=f5e461]:
                        - strong [ref=f5e462]: Три маяка за один день на машине
                        - text: — Розеве, Ястарня, Хель. Мы сделали именно так, но выехали рано и вернулись в темноте.
                      - listitem [ref=f5e463]:
                        - strong [ref=f5e464]: Коса на велосипеде
                        - text: — вдоль всей косы идёт отдельная велодорожка от Владыславово до Хеля, около 35 км в одну сторону, почти без набора высоты. Один из самых красивых веломаршрутов Польши и, пожалуй, лучший способ её увидеть. Обратно можно вернуться поездом или паромом.
                      - listitem [ref=f5e465]:
                        - strong [ref=f5e466]: Оконечность косы пешком
                        - text: — от Хельского маяка до Cypel Helski и обратно по пляжу, 6–8 км, с заходом на тропы крепости.
                      - listitem [ref=f5e467]:
                        - strong [ref=f5e468]: Дюны Чолпино
                        - text: — от парковки до моря и обратно 4–5 км по бору и песку, полдня с фотоаппаратом.
                      - listitem [ref=f5e469]:
                        - strong [ref=f5e470]: Долина Слупи на велосипеде
                        - text: — круг 30–35 км по грунтовкам, без единого туриста.
                    - heading "Практическая информация" [level=2] [ref=f5e471]
                    - heading "Как добраться" [level=3] [ref=f5e472]
                    - list [ref=f5e473]:
                      - listitem [ref=f5e474]:
                        - strong [ref=f5e475]: "На машине:"
                        - text: "из Гданьска до Хеля около 100 км через Владыславово, 1,5–2 часа без пробок. Летом коса стоит: въезд лучше проходить до 9 утра. Зато вне сезона дорога пустая."
                      - listitem [ref=f5e476]:
                        - strong [ref=f5e477]: "На поезде:"
                        - text: прямые поезда из Гданьска и Гдыни до станции Hel, около 2 часов; летом ходит сезонный «Słoneczny». Вокзал в Хеле — в десяти минутах от маяка.
                      - listitem [ref=f5e478]:
                        - strong [ref=f5e479]: "На пароме:"
                        - text: в сезон из Гдыни, Сопота и Гданьска в Хель ходят суда — самый приятный вариант, 1–1,5 часа по заливу.
                      - listitem [ref=f5e480]:
                        - strong [ref=f5e481]: "До нашей базы:"
                        - text: Кшыня — это 30 км от Слупска и около 130 км от Гданьска, то есть до косы примерно 2 часа. Если ехать только ради маяков, логичнее жить в районе Пуцка или Владыславово.
                    - heading "Когда ехать" [level=3] [ref=f5e482]
                    - paragraph [ref=f5e483]: "Мы были в апреле и остались очень довольны: пустые пляжи, чистый свет, никаких очередей и цены вне сезона. Минус — вода холодная, часть маяков и музеев ещё закрыта, а на ветру нужен пуховик."
                    - paragraph [ref=f5e484]: Июль-август — это купание, все объекты открыты, но коса забита, парковки платные и дорогие, а жильё нужно бронировать за месяцы. Май-июнь и сентябрь — компромисс.
                    - heading "Деньги, парковки, мелочи" [level=3] [ref=f5e485]
                    - list [ref=f5e486]:
                      - listitem [ref=f5e487]: "Наличные злотые нужны: у маяков и на мелких парковках карты принимают не везде."
                      - listitem [ref=f5e488]: Парковки в Хеле платные, ближе к маяку дороже; бесплатные места есть на въезде в город.
                      - listitem [ref=f5e489]: "Обувь — закрытая: песок в дюнах и бору мелкий и попадает везде."
                      - listitem [ref=f5e490]: "Ветер на косе сильнее, чем кажется по прогнозу: на пляже всегда на несколько градусов холоднее."
                      - listitem [ref=f5e491]: Заранее проверяйте часы работы маяков — вне сезона они открыты только по выходным или закрыты совсем.
                    - heading "Наши впечатления" [level=2] [ref=f5e492]
                    - paragraph [ref=f5e493]: Эта неделя оказалась намного больше, чем прогулка по маякам. Дом на озере, где утро начинается с печки и мокрых собак; лес, в котором можно ехать час и не встретить машину; дюны, где кажется, что ты первый человек на этом берегу; и один длинный день на косе, спрессовавший в себя всё сразу — маяки, бункеры, море и закат по дороге домой.
                    - paragraph [ref=f5e494]: "Если выбирать формат, я бы советовала именно такой: снять один дом на неделю где-то в глубине Кашубии и ездить от него радиально. Так побережье открывается совсем иначе, чем из отеля в курортном городке."
                    - heading "Что рядом" [level=2] [ref=f5e495]
                    - list [ref=f5e496]:
                      - listitem [ref=f5e497]:
                        - link "Словинский национальный парк" [ref=f5e498] [cursor=pointer]:
                          - /url: https://metravel.by/travels/slovinskiy-nacionalnyy-park-slupsk
                        - text: — «ходячие» дюны и пустые пляжи в часе езды от Хельской косы.
                      - listitem [ref=f5e499]:
                        - 'link "Путешествие в Польшу на 4 дня: Сувалки, Эльблонг, Гданьск, Леба" [ref=f5e500] [cursor=pointer]':
                          - /url: https://metravel.by/travels/puteshestvie-v-polshu-na-4-dnia-marshrut-minsk-suvalki-elblong-gdansk-leba
                        - text: — маршрут вдоль побережья, если неделю выделить не получается.
                      - listitem [ref=f5e501]:
                        - link "Замок Мальборк" [ref=f5e502] [cursor=pointer]:
                          - /url: https://metravel.by/travels/zamok-malbork-krupneishaia-kirpichnaia-krepost-mira-putevoditel
                        - text: — крупнейшая кирпичная крепость мира, час от Гданьска и логичное дополнение к морю.
                      - listitem [ref=f5e503]:
                        - 'link "Торунь: старый город и музей пряника" [ref=f5e504] [cursor=pointer]':
                          - /url: https://metravel.by/travels/torun-staryi-gorod-i-muzei-prianika-polsha
                        - text: — родина Коперника, ганзейский город с тевтонским замком.
                    - generic [ref=f5e505]:
                      - 'heading "Частые вопросы: Хельская коса и маяки" [level=2] [ref=f5e506]'
                      - group [ref=f5e507]:
                        - strong [ref=f5e509] [cursor=pointer]: Реально ли успеть три маяка — Ястарня, Гора Шведов и Хель — за один день?
                      - group [ref=f5e510]:
                        - strong [ref=f5e512] [cursor=pointer]: Можно ли подняться на Хельский маяк и сколько это стоит?
                      - group [ref=f5e513]:
                        - strong [ref=f5e515] [cursor=pointer]: Почему маяк Гора Шведов выглядит заброшенным?
                      - group [ref=f5e516]:
                        - strong [ref=f5e518] [cursor=pointer]: Как доехать до Хеля без машины и где парковаться, если на машине?
                      - group [ref=f5e519]:
                        - strong [ref=f5e521] [cursor=pointer]: Можно ли ехать на Хельскую косу с собаками?
                      - group [ref=f5e522]:
                        - strong [ref=f5e524] [cursor=pointer]: Когда лучше ехать на Хельскую косу?
            - generic [ref=f5e525]:
              - generic "Рекомендации" [ref=f5e526]:
                - generic [ref=f5e527]:
                  - button "Рекомендации, развёрнуто" [expanded] [ref=f5e528] [cursor=pointer]:
                    - generic [ref=f5e529]: Рекомендации
                    - generic [ref=f5e534]: Опыт автора
                  - list [ref=f5e544]:
                    - listitem [ref=f5e545]: Выезжайте на косу рано утром — и летом из-за пробок, и вне сезона ради света.
                    - listitem [ref=f5e546]: "Не селитесь на самой косе: в глубине Кашубии дешевле, тише и есть куда выпустить собак."
                    - listitem [ref=f5e547]: С собаками ищите дом с огороженным участком и уточняйте размер и количество — «przyjazny zwierzętom» часто значит «маленькую можно».
                    - listitem [ref=f5e548]: В Словинском парке собака только на поводке.
                    - listitem [ref=f5e549]: Рыбу берите в «smażalnia ryb» — жарильне по весу, а не в ресторане.
                    - listitem [ref=f5e550]: Если есть велосипеды, проезжайте косу от Владыславово до Хеля, а обратно возвращайтесь поездом или паромом.
                    - listitem [ref=f5e551]: "Заранее проверяйте часы работы маяков: вне сезона они часто закрыты."
