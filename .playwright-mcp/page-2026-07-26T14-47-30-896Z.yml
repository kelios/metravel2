                    - listitem [ref=f5e573]: "Оконечность косы — бывший Укреплённый район Хель: бункеры прямо в сосновом бору, с маркированными тропами."
                    - listitem [ref=f5e574]: База в глубине Кашубии дешевле и тише, чем на самой косе, и туда пускают с собаками.
