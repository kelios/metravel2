                    - heading "Как добраться" [level=2] [ref=f1e434]
                    - paragraph [ref=f1e435]: "Вход в скальный город находится у деревни Адршпах (Adršpach) на севере Чехии, у самой польской границы. Прямо возле входа — большая платная парковка, кафе, туалеты и информационный центр, а напротив — железнодорожная станция Adršpach: сюда ходят поезда из Трутнова."
                    - paragraph [ref=f1e436]:
                      - text: Мы приехали на машине со стороны Польши после прогулки по Рудавам Яновицким. Адршпах вообще удобно совмещать с польскими Судетами — в часе-полутора езды отсюда
