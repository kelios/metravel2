                - 'button "Адршпашские скалы: маршрут по скальному городу, где снимали «Хроники Нарнии», развёрнуто" [expanded] [ref=f1e246] [cursor=pointer]':
                  - generic [ref=f1e247]:
                    - 'img "Адршпашские скалы: маршрут по скальному городу, где снимали «Хроники Нарнии»" [ref=f1e250]'
                    - generic [ref=f1e254]: "Адршпашские скалы: маршрут по скальному городу, где снимали «Хроники Нарнии»"
                - generic [ref=f1e259]:
                  - generic [ref=f1e260]: "лучший сезон: май · ~11 мин чтения"
                  - heading "Содержание маршрута" [level=2] [ref=f1e262]
                  - generic [ref=f1e266]:
                    - paragraph [ref=f1e267]: "Адршпашские скалы (Адршпах) — огромный песчаниковый скальный город на севере Чехии у польской границы, где снимали первую часть «Хроник Нарнии». Рассказываем, каким получился наш маршрут по каменному лабиринту и что важно знать перед поездкой: билеты, часы работы, парковка и как сюда добраться."
                    - paragraph [ref=f1e268]: "На нашу годовщину мы решили не устраивать торжественный ужин с обязательным сидением за столом, а провести день так, как нравится нам: сначала погулять по Рудавам Яновицким, а затем перейти польско-чешскую границу и отправиться в Адршпашско-Теплицкие скалы."
                    - paragraph [ref=f1e269]:
                      - text: "До этой поездки мы знали о месте в основном одно: здесь снимали первую часть"
                      - strong [ref=f1e270]: «Хроник Нарнии» — «Лев, колдунья и волшебный шкаф»
                      - text: .
                    - paragraph [ref=f1e271]: Съёмки проходили в Чехии в 2005 году, в том числе среди Адршпашско-Теплицких скал. Зимнюю Нарнию начинали снимать в Чешской Швейцарии, но оттепель заставила съёмочную группу срочно переезжать в Адршпах — здесь ещё лежало полметра снега. В фильме дети Певенси проходят через готические ворота, за которыми начинается совершенно подходящий для Нарнии каменный лабиринт.
                    - paragraph [ref=f1e273]:
                      - img "Готические ворота — арка, прорубленная в скальной стене" [ref=f1e274]
                    - heading "Адршпашский скальный город" [level=2] [ref=f1e275]
                    - paragraph [ref=f1e276]:
                      - text: Адршпашские скалы — это огромный лабиринт из песчаниковых стен, башен, ущелий и узких проходов. Некоторые коридоры настолько тесные, что одновременно разойтись в них двум встречным потокам туристов было бы отдельным аттракционом. Скалы сформировались около
                      - strong [ref=f1e277]: 89 миллионов лет назад
                      - text: ". Когда-то эта территория находилась на дне моря: песок и известковые глины постепенно уплотнились и превратились в песчаник. После отступления моря породу миллионы лет разрушали вода, мороз, солнце и ветер, пока цельное песчаниковое плато не разделилось на отдельные стены и башни."
                    - generic [ref=f1e278]:
                      - paragraph [ref=f1e279]:
                        - img "Деревянный настил в узком скальном коридоре" [ref=f1e280]
                      - paragraph [ref=f1e281]:
                        - img "Песчаниковое плато, разбитое эрозией на отдельные башни" [ref=f1e282]
                    - paragraph [ref=f1e283]: Возле входа расположена большая организованная парковка, железнодорожная станция, кафе, туалеты и информационный центр.
                    - paragraph [ref=f1e285]:
                      - img "Старый щит с картой маршрута по Адршпашским скалам" [ref=f1e286]
                    - paragraph [ref=f1e287]: Практически сразу за кассами начинается тропа вокруг яркого бирюзового озера Писковна. Это бывший песчаниковый карьер. Песок здесь добывали с 1920 по 1971 год, после чего карьер затопило. Сейчас площадь озера составляет около трёх гектаров, а максимальная глубина достигает 12,5 метра.
                    - generic [ref=f1e288]:
                      - paragraph [ref=f1e289]:
                        - img "Бирюзовое озеро Писковна сквозь ветви" [ref=f1e290]
                      - paragraph [ref=f1e291]:
                        - img "На камне у бирюзовой воды бывшего карьера" [ref=f1e292]
                    - paragraph [ref=f1e293]: Уже возле озера красиво, но настоящее скальное городище начинается чуть дальше.
                    - generic [ref=f1e294]:
                      - paragraph [ref=f1e295]:
                        - img "Озеро Писковна и заросшие борта старого карьера" [ref=f1e296]
                      - paragraph [ref=f1e297]:
                        - img "Отдых на камне у воды" [ref=f1e298]
                    - paragraph [ref=f1e299]: Тропа постепенно уходит в лес, а затем входит между вертикальными стенами.
                    - generic [ref=f1e300]:
                      - paragraph [ref=f1e301]:
                        - img "Скальные башни и каменная арка на фоне неба" [ref=f1e302]
                      - paragraph [ref=f1e303]:
                        - img "Тёмный скальный коридор с деревянным настилом" [ref=f1e304]
                    - paragraph [ref=f1e305]:
                      - text: Одно из самых узнаваемых мест маршрута —
                      - strong [ref=f1e306]: Готические ворота
                      - text: ". Несмотря на средневековый вид, никакого древнего замка здесь не было. Ворота построили в 1839 году по распоряжению владельца местного имения Людвига Карла Надерного (Ludvík Karel Nádherný). В то время они обозначали основной вход в скальный город. Вместе с воротами появились дорожки, мостики, лестницы и переходы, по которым туристы ходят до сих пор. Именно эти ворота обычно называют воротами в Нарнию. Стоя перед ними, легко понять, почему создатели фильма выбрали это место: декорации здесь действительно не требовались."
                    - paragraph [ref=f1e308]:
                      - 'img "Готические ворота: фигура человека в проёме даёт масштаб" [ref=f1e309]'
                    - heading "История скального города" [level=2] [ref=f1e310]
                    - paragraph [ref=f1e311]: Долгое время скалы оставались почти непроходимой территорией. Местные жители заходили сюда главным образом во время войн, когда в каменном лабиринте можно было спрятаться.
                    - generic [ref=f1e312]:
                      - paragraph [ref=f1e313]:
                        - img "Лестница в скальном ущелье" [ref=f1e314]
                      - paragraph [ref=f1e315]:
                        - img "Имена и даты XIX века, вырезанные в мягком песчанике" [ref=f1e316]
                    - paragraph [ref=f1e317]: "Мягкий песчаник и сегодня хранит следы первых туристов: на стенах вдоль тропы вырезаны имена и даты XIX века — тогда это считалось нормальным способом отметиться."
                    - paragraph [ref=f1e318]: Первые путешественники начали приезжать сюда в XVIII веке. В 1790 году Адршпах посетил Иоганн Вольфганг Гёте, интересовавшийся не только литературой, но также ботаникой и геологией. Возле Большого водопада ему позднее установили бюст — он стоит там с 1932 года.
                    - paragraph [ref=f1e320]:
                      - img "Каменный блок, заклиненный между двумя стенами" [ref=f1e321]
                    - paragraph [ref=f1e322]: Массовый туризм начался почти случайно. В 1824 году в скалах произошёл огромный лесной пожар, продолжавшийся несколько недель. Огонь уничтожил значительную часть растительности, проходы между башнями открылись, и скальный город впервые стало возможно нормально исследовать.
                    - paragraph [ref=f1e323]: В 1828 году имение приобрёл барон Людвиг Карл Надерный. При нём здесь построили туристические тропы, лестницы, мосты и смотровые площадки.
                    - paragraph [ref=f1e325]:
                      - img "Настил через лес между скалами" [ref=f1e326]
                    - paragraph [ref=f1e327]: "Посетителей в XIX веке развлекали с размахом: возле Малого водопада играли арфистки, а в месте с семикратным эхом трубили в охотничьи рога и стреляли из небольшой мортиры. Обычной таблички «здесь хорошая акустика» тогда, видимо, считалось недостаточно."
                    - generic [ref=f1e328]:
                      - paragraph [ref=f1e329]:
                        - img "Узкий тёмный проход с полоской неба наверху" [ref=f1e330]
                      - paragraph [ref=f1e331]:
                        - img "Большой водопад в узком ущелье" [ref=f1e332]
                    - heading "Что находится на маршруте" [level=2] [ref=f1e333]
                    - paragraph [ref=f1e334]:
                      - text: Основной круговой маршрут проходит по зелёной маркировке. Его официальная длина — около
                      - strong [ref=f1e335]: 3,5 километра
                      - text: ", но из-за лестниц, остановок и ответвлений короткой прогулкой он не ощущается. На прохождение советуют закладывать не менее трёх часов."
                    - paragraph [ref=f1e336]: "По дороге встречаются десятки скал с названиями, которые появились благодаря их форме:"
                    - list [ref=f1e337]:
                      - listitem [ref=f1e338]:
                        - strong [ref=f1e339]: Сахарная голова
                        - text: "стоит на узком основании: нижняя часть имеет ширину около трёх метров, а верхняя — около тринадцати. Туристы подкладывают к скале палочки, будто помогают ей не упасть."
                      - listitem [ref=f1e340]:
                        - strong [ref=f1e341]: Кувшин
                        - text: получил название из-за шестиметрового отверстия, похожего на ручку.
                      - listitem [ref=f1e342]:
                        - strong [ref=f1e343]: Мышиная нора
                        - text: — проход шириной около 50 сантиметров; этот узкий лаз тоже попал в кадры «Нарнии».
                      - listitem [ref=f1e344]:
                        - strong [ref=f1e345]: Мэр и жена мэра
                        - text: — две стоящие рядом башни.
                      - listitem [ref=f1e346]:
                        - strong [ref=f1e347]: Влюблённые
                        - text: — самая высокая скала Адршпаха, достигающая 81,4 метра.
                    - paragraph [ref=f1e348]: Названия иногда приходится долго искать глазами. Потом внезапно замечаешь профиль, лицо или фигуру — и уже невозможно понять, как ты раньше этого не видел.
                    - generic [ref=f1e349]:
                      - paragraph [ref=f1e350]:
                        - img "Каменный «гриб» у тропы" [ref=f1e351]
                      - paragraph [ref=f1e352]:
                        - img "Песчаниковые башни на фоне неба" [ref=f1e353]
                      - paragraph [ref=f1e354]:
                        - img "Скальные башни над лесом" [ref=f1e355]
                    - heading "Большой водопад и прогулка на лодке" [level=2] [ref=f1e356]
                    - paragraph [ref=f1e357]: Большой водопад падает в узкое ущелье с высоты около 16 метров. Его поток частично регулируется, потому что непосредственно над водопадом находится Скальное озеро. Зимой вода замерзает и превращается в ледопад.
                    - paragraph [ref=f1e358]: На Скальном озере можно прокатиться на плоскодонной лодке. Когда-то водоём использовали для сплава древесины, а первых туристов начали катать здесь более 150 лет назад.
                    - generic [ref=f1e359]:
                      - paragraph [ref=f1e360]:
                        - img "Поток Большого водопада" [ref=f1e361]
                      - paragraph [ref=f1e362]:
                        - img "Ручей с рыжей от торфа водой в ущелье" [ref=f1e363]
                    - paragraph [ref=f1e364]: "Важно не перепутать два озера:"
                    - list [ref=f1e365]:
                      - listitem [ref=f1e366]: бирюзовая Писковна возле входа — бывший карьер, вокруг которого проходит пешеходная тропа;
                      - listitem [ref=f1e367]: лодки ходят по небольшому Скальному озеру возле Большого водопада.
                    - paragraph [ref=f1e368]: "Прогулка длится около 20 минут. Билет покупается отдельно возле лестницы к озеру, только за наличные чешские кроны: взрослый — 100, детский — 50. Собаки на лодки не допускаются."
                    - paragraph [ref=f1e370]:
                      - img "Информационный щит с картой и правилами скального города" [ref=f1e371]
                    - heading "Лестницы и реальная сложность маршрута" [level=2] [ref=f1e372]
                    - paragraph [ref=f1e373]: В описаниях маршрут часто называют лёгким, и технически это действительно не горный поход. Здесь есть поручни, деревянные настилы, мостики и оборудованные ступени.
                    - paragraph [ref=f1e374]:
                      - text: "Но есть важный нюанс:"
                      - strong [ref=f1e375]: лестниц очень много
                      - text: .
                    - generic [ref=f1e376]:
                      - paragraph [ref=f1e377]:
                        - img "Подъём по каменистой лестнице-тропе" [ref=f1e378]
                      - paragraph [ref=f1e379]:
                        - img "Металлические перила на крутом спуске" [ref=f1e380]
                    - generic [ref=f1e381]:
                      - paragraph [ref=f1e382]:
                        - img "Каменистая тропа между скалами в лесу" [ref=f1e383]
                      - paragraph [ref=f1e384]:
                        - img "На каменных ступенях в ущелье" [ref=f1e385]
                    - paragraph [ref=f1e386]: Некоторые подъёмы довольно крутые и узкие, а после них почти сразу начинается спуск. Поэтому человеку без физической подготовки, с проблемами коленей или с боязнью лестниц полный маршрут может показаться тяжёлым.
                    - paragraph [ref=f1e387]: Можно пройти только короткую часть вокруг озера и первые скальные коридоры. Но самые интересные места находятся дальше, поэтому при возможности лучше не торопиться, делать остановки и выделить на прогулку большую часть дня.
                    - paragraph [ref=f1e388]: Мы дошли и до одной из смотровых площадок. Честно говоря, сама площадка вызвала у нас меньше восторга, чем путь к ней. Ради одного вида я бы туда, возможно, не поднималась. А вот скалы, лестницы, ущелья и переходы действительно производят очень сильное впечатление.
                    - generic [ref=f1e389]:
                      - paragraph [ref=f1e390]:
                        - 'img "Скальный город сверху: башни уходят за горизонт" [ref=f1e391]'
                      - paragraph [ref=f1e392]:
                        - img "Вид на скальный город со смотровой площадки" [ref=f1e393]
                    - heading "Теплицкие скалы и маршрут без толпы" [level=2] [ref=f1e394]
                    - paragraph [ref=f1e395]: Большинство посетителей проходит стандартное кольцо по Адршпашским скалам и возвращается ко входу. Но если на развилке продолжить движение в сторону Теплицких скал, людей становится заметно меньше.
                    - paragraph [ref=f1e396]:
                      - text: Два скальных массива соединяет
                      - strong [ref=f1e397]: Волчье ущелье — Vlčí rokle
                      - text: ", протянувшееся примерно на четыре километра. Сами Теплицкие скалы более обширные и дикие: здесь меньше отдельно стоящих башен, зато больше длинных каменных стен, ущелий и плотных скальных лабиринтов. Основной синий маршрут по Теплицким скалам имеет длину около шести километров."
                    - paragraph [ref=f1e398]: "Нам именно эта часть особенно понравилась. После оживлённого Адршпаха начинается практически обычный поход: лес, скалы, длинная тропа и почти никого вокруг."
                    - generic [ref=f1e399]:
                      - paragraph [ref=f1e400]:
                        - img "Настил через торфяную поляну в Теплицких скалах" [ref=f1e401]
                      - paragraph [ref=f1e402]:
                        - img "Привал на деревянном настиле среди болотной поляны" [ref=f1e403]
                      - paragraph [ref=f1e404]:
                        - img "Длинный настил через мшистый лес" [ref=f1e405]
                    - paragraph [ref=f1e406]:
                      - text: "Если проходить оба скальных города полностью, нужен целый день. Возвращаться необязательно тем же путём: между Адршпахом и Теплице-над-Метуи ходит поезд, а станции расположены возле входов в туристические зоны. Расписание лучше проверить заранее — удобнее всего на"
                      - link "idos.cz" [ref=f1e407] [cursor=pointer]:
                        - /url: https://idos.cz/
                      - text: .
                    - heading "Легенда о заколдованном городе" [level=2] [ref=f1e408]
                    - paragraph [ref=f1e409]: Геологи объясняют появление скал движением земной коры, водой и эрозией. Но у местных жителей была собственная версия.
                    - paragraph [ref=f1e410]: По легенде, когда-то на месте скал находились богатые города. Их жители пропустили через свои земли разбойников и тем самым предали соседей. Боги разгневались и превратили в камень и города, и всех их обитателей. Поэтому отдельные башни напоминают людей, дома, стены и городские ворота.
                    - paragraph [ref=f1e411]:
                      - text: С другим местом связана вполне реальная, хотя почти легендарная история. В 1772 году два англичанина специально приехали в Адршпах, чтобы посмотреть на грозу среди скал. Они ждали восемь дней, а когда гроза всё-таки началась, спрятались под каменным навесом. Рядом ударила молния, и с противоположной стены сорвался огромный блок. Камень рухнул перед путешественниками, но оба остались живы. Теперь его называют
                      - strong [ref=f1e412]: Громовым камнем
                      - text: .
                    - paragraph [ref=f1e414]:
                      - img "Мшистый скальный выступ у тропы" [ref=f1e415]
                    - heading "Маршрут в цифрах" [level=2] [ref=f1e416]
                    - paragraph [ref=f1e418]:
                      - img "Каменные ступени в ущелье — таких подъёмов на маршруте десятки" [ref=f1e419]
                    - list [ref=f1e420]:
                      - listitem [ref=f1e421]:
                        - strong [ref=f1e422]: Длина
                        - text: "кольца по Адршпашским скалам: около 3,5 км по маркированной тропе."
                      - listitem [ref=f1e423]:
                        - strong [ref=f1e424]: Перепад высот
                        - text: ": около 100 м, много коротких подъёмов и спусков по лестницам."
                      - listitem [ref=f1e425]:
                        - strong [ref=f1e426]: Время
                        - text: ": не меньше трёх часов на основное кольцо; вместе с Теплицкими скалами — целый день."
                      - listitem [ref=f1e427]:
                        - strong [ref=f1e428]: Сложность
                        - text: ": тропа благоустроена — настилы, мостики, поручни, — но лестницы требуют сил."
