                    - paragraph [ref=f1e454]: В тёплый день идите с утра — после 11:00 в скальных коридорах начинаются заторы. Если хотите тишину, выбирайте будний день вне каникул или октябрь.
                    - heading "Где поесть" [level=2] [ref=f1e455]
                    - paragraph [ref=f1e456]: "Кафе есть и у входа, и внутри скального города — у Скального озера, возле лодочной пристани. Но приятнее пообедать уже после маршрута, в одном из ресторанов у парковки: чешская кухня здесь дешевле, чем в туристической зоне, и порции честные. Классический набор — гуляш с кнедликами и разливное пиво."
