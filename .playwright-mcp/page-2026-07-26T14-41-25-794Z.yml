                    - heading "Что важно знать, если пойдёте" [level=2] [ref=e2247]
                    - list [ref=e2248]:
                      - listitem [ref=e2249]:
                        - strong [ref=e2250]: "Маршрут:"
                        - text: прибрежная тропа GR21 вдоль Алебастрового берега (Côte d'Albâtre), от Дьепа в сторону Этрета. Около 110 км за 6 дней, дневные переходы 15–25 км.
                      - listitem [ref=e2251]:
                        - strong [ref=e2252]: Приливы и отливы — обязательно.
                        - text: "Если идёте низом по пляжу/дну моря, сверяйте расписание приливов заранее: вода прибывает очень быстро, это вопрос безопасности."
                      - listitem [ref=e2253]:
                        - strong [ref=e2254]: Скалы обваливаются.
                        - text: Не подходите вплотную к подножию утёсов и не сидите под ними — особенно в районе Этрета.
                      - listitem [ref=e2255]:
                        - strong [ref=e2256]: Жильё бронируйте заранее
                        - text: и держите запасной вариант, особенно в жару и в сезон. Будьте готовы к ценам 100–200 € за ночь и к старым домам с винтовыми лестницами (местами сыро/плесень — это нормандская норма).
                      - listitem [ref=e2257]:
                        - strong [ref=e2258]: Жара.
                        - text: В аномальную жару выходите как можно раньше (6–7 утра); на открытом плато тени нет совсем — низом у моря всегда легче из-за бриза.
                      - listitem [ref=e2259]:
                        - strong [ref=e2260]: Еда по расписанию.
                        - text: Кухни работают по времени (обед заканчивается рано) — не рассчитывайте поесть в 15:00; берите перекус с собой.
                      - listitem [ref=e2261]:
                        - strong [ref=e2262]: "Что попробовать:"
                        - text: мидии и устрицы (здесь они великолепны), ликёр Бенедиктин и кальвадос в Фекане, французский сидр, нормандские десерты.
                    - paragraph [ref=e2263]: "Шесть дней Алебастрового берега — это меловые скалы, тёплое море, кролики на обрывах, родник, сочащийся прямо из скалы, и лучшие устрицы в нашей жизни. Маршрут не технический, но в жару и с приливами требует уважения и подготовки. И да — оно того стоит: таких пейзажей мы не видели нигде."
                    - heading "Что рядом" [level=2] [ref=e2264]
