                    - paragraph [ref=e1994]: "В первый день прошли километров двадцать пять по жаре — но шли много через лес, так что было терпимо. А потом — пять километров вдоль моря: с одной стороны вода, с другой белые утёсы. Вода, удивительно, совсем тёплая, можно купаться."
