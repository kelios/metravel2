                    - heading "День 2. По дну моря и зной на плато" [level=2] [ref=e2030]
                    - paragraph [ref=e2031]
                    - paragraph [ref=e2032]: Пятнадцать километров и экстремальная жара. Воду пришлось искать с утра в центре городка (заправка, почта, магазин, бар) и идти решили по берегу, чтобы не тащиться по раскалённым полям.
                    - generic [ref=e2033]:
                      - paragraph [ref=e2034]:
                        - img "Закат над морем с террасы" [ref=e2035]
                      - paragraph [ref=e2036]:
                        - img "Завтрак под навесом" [ref=e2037]
                    - paragraph [ref=e2038]:
                      - text: "И тут — важнейший совет:"
                      - strong [ref=e2039]: обязательно сверяйте время приливов и отливов.
                      - text: "Есть сайты, где это легко проверить, и делать это нужно всегда: вода прибывает очень быстро, и без проверки можно попасть в беду. Зато идти по обнажившемуся дну невероятно интересно — красивые камни, ракушки, устрицы, и у моря всегда лёгкий бриз. К скалам близко не подходите: сверху периодически осыпаются камни."
