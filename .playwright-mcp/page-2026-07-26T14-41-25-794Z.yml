                        - img "Посёлок в бухте и меловой мыс с высоты тропы" [ref=e2188]
                      - paragraph [ref=e2189]:
                        - img "Закат с террасы ночёвки" [ref=e2190]
                    - heading "День 5. Кролики, поля и Фекан" [level=2] [ref=e2191]
                    - paragraph [ref=e2193]:
                      - img "Улица Фекана" [ref=e2194]
                    - paragraph [ref=e2195]: "Шли в основном по открытым утёсам. Самое милое — кролики: на участке у края скал, где старые дома и территория выселены, теперь живут сотни кроликов с норками. Появился ветер, собиралась гроза (но так и не случилась). Дошли к полудню, около двадцати километров. Заселение здесь по-божески — с 15:30, самая дешёвая двухзвёздочная гостиница почти на первой линии, снова старинный дом с винтовой лестницей."
                    - paragraph [ref=e2196]:
                      - text: А вечером —
                      - strong [ref=e2197]: Фекан (Fécamp)
                      - text: ", просто восхитительный: замок, церкви. Здесь стоит попробовать знаменитый ликёр Бенедиктин по старинным рецептам, кальвадос и рыбу. Мы заказали ската, утку, тартар, салат с козьим сыром и два десерта — нормандский с кальвадосом и крем-брюле с бенедиктином. Восхитительный день."
                    - generic [ref=e2198]:
                      - paragraph [ref=e2199]:
                        - img "Корова на тропе — обычный попутчик на нормандских полях" [ref=e2200]
                      - paragraph [ref=e2201]:
