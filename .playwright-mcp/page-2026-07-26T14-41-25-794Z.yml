                    - generic [ref=e2158]:
                      - paragraph [ref=e2159]:
                        - img "Селфи вдвоём после долгого перехода" [ref=e2160]
                      - paragraph [ref=e2161]:
                        - img "Путник на широкой грунтовой дороге" [ref=e2162]
                    - paragraph [ref=e2163]:
                      - text: "Ночевали в старинном шале с огромным парком прямо напротив атомной станции: винтовая лестница, комната под крышей за 100 €, душ и туалет общие. Чисто и аккуратно, но без кондиционера в такую жару комната не проветривалась совсем."
                      - img "Усадьба-гостиница за оградой" [ref=e2164]
                    - paragraph [ref=e2166]:
                      - img "Лестница с красной ковровой дорожкой" [ref=e2167]
                    - paragraph [ref=e2168]
                    - heading "День 4. Лес, деревни и сарайчик в плесени" [level=2] [ref=e2169]
                    - paragraph [ref=e2170]: "Пожалуй, самый приятный день: дорога почти всё время шла лесами, с парой красивых бухтовых долин. Минус — негде было поесть: магазины есть, ресторанов нет, обошлись бананами из магазина. День жаркий, за тридцать, но в лесу терпимо; к трём завалились на пляж. Ночёвка — снова «сарайчик» за 200 €, как старый автодом: душно и весь в плесени (потолок, двери) — в этом регионе с влажностью это обычное дело. В соседнем кемпинге был бассейн и «тарелки» (сыр, колбаса, вино, мороженое) — пиццу, правда, в этот день не делали."
                    - generic [ref=e2171]:
                      - paragraph [ref=e2172]:
                        - img "Тропа GR21 через ячменные поля над морем" [ref=e2173]
                      - paragraph [ref=e2174]:
