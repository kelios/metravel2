                  - generic [ref=e1328]:
                    - paragraph [ref=e1919]: Мы прошли пешком знаменитый Алебастровый берег Нормандии — около ста километров за шесть дней, от Дьепа до Этрета, по прибрежной тропе GR21. Белые меловые скалы, тёплое море, рыбацкие деревни, устрицы и кальвадос — и при этом аномальная жара под тридцать, приливы, по которым приходится сверять каждый шаг, и пара приключений ещё до старта. Это рассказ о том, как всё было на самом деле, и что стоит знать, если решитесь повторить.
                    - heading "Что такое GR21" [level=2] [ref=e1920]
                    - paragraph [ref=e1922]:
                      - img "Меловые скалы Этрета и тропа GR21" [ref=e1923]
                    - paragraph [ref=e1924]: "GR21 (Grande Randonnée 21), его же называют «тропой скал» (sentier des falaises) — официальный маршрут дальнего пешего туризма во Франции. Он идёт вдоль Алебастрового берега (Côte d'Albâtre) в Нормандии, в департаменте Приморская Сена, от Гавра (Le Havre) до Ле-Трепора (Le Tréport): около 180 км, которые в среднем проходят за девять дней."
                    - paragraph [ref=e1925]: Маршрут размечен характерной бело-красной маркировкой и входит в национальную сеть троп GR (Grande Randonnée), которую создаёт и поддерживает Французская федерация пешего туризма (FFRandonnée) — та самая система «гранд-рандоннэ», что охватывает всю Францию. В 2020 году GR21 получил звание «любимого GR французов» (GR préféré des randonneurs), и это заслуженно.
                    - paragraph [ref=e1926]: "Тропа всё время чередует два мира: дикое побережье с меловыми утёсами, галечными пляжами и рыбацкими портами — и сельскую глубинку Pays de Caux с буковыми лесами, пастбищами с нормандскими коровами и старинными усадьбами. Полностью маршрут идёт от Гавра до Ле-Трепора; мы прошли его южную половину — от Дьепа в сторону Этрета, за шесть дней."
                    - paragraph [ref=e1928]:
                      - img "На тропе GR21 у скал Этрета" [ref=e1929]
                    - 'heading "Как мы добирались: Краков — Париж — Руан" [level=2] [ref=e1930]'
                    - paragraph [ref=e1932]:
                      - img "На вокзале перед выездом с рюкзаками" [ref=e1933]
                    - paragraph [ref=e1934]: "Из Кракова в Париж долетели быстро и без приключений — приключения начались в аэропорту Шарль-де-Голль. Электрички из аэропорта почему-то не ходили, вместо них пустили автобусы: очередь минут на тридцать, двухэтажный автобус, мы сели наверху прямо над водителем — высоко, и кажется, что ветки хлещут по лицу. Автобус довёз до вокзала, дальше цепочки волонтёров показывали дорогу: одна остановка до Северного вокзала (Gare du Nord), пешком до Сен-Лазар (Saint-Lazare) — и оттуда поезд до Руана."
                    - paragraph [ref=e1936]:
                      - img "Селфи на вокзале перед стартом маршрута" [ref=e1937]
                    - paragraph [ref=e1938]: "И вот тут — главное предупреждение поездки. Пока мы летели, с Booking пришло сообщение: за забронированные апартаменты (около 100 €) деньги списали, а хозяин пишет «идите в Booking, у нас ошибка, принять вас не можем»."
                    - paragraph [ref=e1939]: Мы уже в Руане, семь вечера.
                    - paragraph [ref=e1941]:
                      - img "У фасада Руанского собора" [ref=e1942]
                    - paragraph [ref=e1943]: "Бронируем вторую квартиру, дороже, 150 € — и тут же то же самое: деньги списаны, «ошибка, принять не можем». 250 € зависли, жилья нет, и ощущение, что это мошенническая схема. Как назло, для Нормандии стояли аномальные дни — всю неделю +30, и местные, похоже, разъехались по морю, свободного жилья почти не было. Спасло койко-место в хостеле (по 60 € с человека): отдельно мужские и женские комнаты, по 4–6 кроватей, но сам по себе хостел оказался классным. Так прошёл наш «день ноль»."
                    - generic [ref=e1944]:
                      - paragraph [ref=e1945]:
                        - img "Комната хостела с двухъярусными кроватями" [ref=e1946]
                      - paragraph [ref=e1947]:
                        - img "Селфи на улице Руана" [ref=e1948]
                    - paragraph [ref=e1949]:
                      - strong [ref=e1950]: "Вывод:"
                      - text: на Алебастровом берегу в жаркую погоду и в сезон бронируйте жильё сильно заранее и держите запасной вариант. И не паникуйте из-за двойных списаний Booking — деньги потом вернули, но нервов это стоило.
                    - 'heading "Руан: город, который мы толком не увидели" [level=2] [ref=e1951]'
                    - paragraph [ref=e1952]: "Утром встали в полседьмого. Любопытная деталь хостела: бельё на заселение не дают, а при выселении ты сам сдаёшь всё, что было на кровати. Из-за всей этой суеты Руан мы посмотреть толком не успели — но то, что увидели, привело в полный восторг. Готические храмы, старый город — таких красивых мы, кажется, ещё не видели."
