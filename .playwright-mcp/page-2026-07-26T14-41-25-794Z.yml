                    - paragraph [ref=e2005]: "За пару километров до ночёвки заглянули отдохнуть в кафе: сделали отличную «ручную» колу и принесли тарелку нарезок — сыры и колбасы (одна, правда, как рубец, на любителя)."
                    - paragraph [ref=e2007]:
