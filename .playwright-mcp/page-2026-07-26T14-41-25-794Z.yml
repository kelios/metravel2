                    - paragraph [ref=e2146]
                    - paragraph [ref=e2147]: "По красоте день спорный: последние десять километров мы практически всё время обходили атомную станцию, местами прямо вдоль трассы по высокой траве. Тяжело, но без вчерашней влажности — чуть легче. Зато в большом городке по пути попробовали мидии — вот это был восторг (после консервированных - небо и земля)."
                    - generic [ref=e2148]:
                      - paragraph [ref=e2149]:
                        - img "Кастрюля мидий с картофелем фри" [ref=e2150]
                      - paragraph [ref=e2151]:
                        - img "Салат с мясной нарезкой" [ref=e2152]
                      - paragraph [ref=e2153]:
