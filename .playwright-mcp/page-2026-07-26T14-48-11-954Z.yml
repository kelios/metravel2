          - generic "Описание маршрута" [ref=f6e1122]:
            - generic [ref=f6e1123]:
              - 'button "Замок Мальборк: крупнейшая кирпичная крепость мира — путеводитель, развёрнуто" [expanded] [ref=f6e1124] [cursor=pointer]':
                - generic [ref=f6e1125]:
                  - 'img "Замок Мальборк: крупнейшая кирпичная крепость мира — путеводитель" [ref=f6e1128]'
                  - generic [ref=f6e1129]: "Замок Мальборк: крупнейшая кирпичная крепость мира — путеводитель"
                - generic [ref=f6e1131]:
                  - generic [ref=f6e1132]: 
                  - generic [ref=f6e1133]: 
              - generic [ref=f6e1135]:
                - generic [ref=f6e1136]: "лучший сезон: апрель · ~16 мин чтения"
                - heading "Содержание маршрута" [level=2] [ref=f6e1138]
                - generic [ref=f6e1301]:
                  - paragraph [ref=f6e1302]: В замок Мальборк мы съездили во время нашего длительного пребывания на Балтике. От Гданьска до него около 60 километров по трассе S7 и DK22, дорога на машине занимает примерно час, хотя летом и в выходные лучше закладывать больше времени.
                  - paragraph [ref=f6e1303]: "Мы приехали в апреле, в обычный будний день. Рядом с замком есть несколько городских и частных парковок. Мы оставили машину на крытой парковке недалеко от входа. Свободных мест было достаточно, очередей возле касс тоже не было: спокойно купили билеты, получили аудиогиды и пошли внутрь."
                  - paragraph [ref=f6e1304]: Летом ситуация может быть совсем другой. У музея действует ограничение на количество посетителей в час, поэтому в высокий сезон билеты советуют приобретать заранее.
                  - paragraph [ref=f6e1306]:
                    - 'img "Замок Мальборк с воды: почти километр кирпичных стен вдоль Ногата" [ref=f6e1307]'
                  - heading "Замок, который я раньше недооценивала" [level=2] [ref=f6e1308]
                  - paragraph [ref=f6e1309]: До этой поездки я не совсем понимала, почему Мальборк считается настолько важным замком.
                  - paragraph [ref=f6e1310]:
                    - text: На фотографиях он казался мне большим, но довольно однообразным. Красный кирпич, стены, башни. Почему-то внешне я сравнивала его с
                    - link "Лидским замком" [ref=f6e1311] [cursor=pointer]:
                      - /url: https://metravel.by/travels/lida-lidskiy-zamok
                    - text: в Беларуси и думала, что внутри будет несколько восстановленных помещений, музей и в основном пустые дворы.
                  - paragraph [ref=f6e1313]:
                    - img "Кирпичные стены и башни Мальборка" [ref=f6e1314]
                  - paragraph [ref=f6e1315]: В итоге я редко настолько ошибалась в ожиданиях от места.
                  - paragraph [ref=f6e1316]: За стенами скрывается не просто крепость, а целый комплекс с переходами, внутренними дворами, жилыми залами, часовнями, галереями и музейными коллекциями. Чем дальше проходишь по маршруту, тем больше понимаешь его настоящий масштаб.
                  - generic [ref=f6e1317]:
                    - paragraph [ref=f6e1318]:
                      - img "Галерея-клуатр Высокого замка" [ref=f6e1319]
                    - paragraph [ref=f6e1320]:
                      - img "Вид из окна на внутренний двор с черепичными крышами" [ref=f6e1321]
                  - generic [ref=f6e1322]:
                    - paragraph [ref=f6e1323]:
                      - img "Интерьер замковой церкви Девы Марии" [ref=f6e1324]
                    - paragraph [ref=f6e1325]:
                      - img "Зал с готическими сводами и узорным керамическим полом" [ref=f6e1326]
                  - paragraph [ref=f6e1327]: На осмотр у нас ушло около половины дня. И это без долгого обеда в ресторане и без попытки подробно рассмотреть каждый музейный экспонат.
                  - heading "Почему Мальборк такой большой" [level=2] [ref=f6e1328]
                  - paragraph [ref=f6e1329]: Строительство замка началось во второй половине XIII века, приблизительно в 1276 году. После того как в 1309 году сюда перенесли резиденцию великого магистра Тевтонского ордена, крепость начали расширять. Мальборк стал не только монастырём и военным укреплением, но также административным центром государства ордена.
                  - paragraph [ref=f6e1330]: Комплекс занимает около 20–21 гектара и считается крупнейшим кирпичным замком в мире. В 1997 году его внесли в список Всемирного наследия ЮНЕСКО как один из наиболее полных примеров готической архитектуры Тевтонского ордена.
                  - generic [ref=f6e1331]:
                    - paragraph [ref=f6e1332]:
                      - 'img "Макет Мальборка: три части комплекса и рвы" [ref=f6e1333]'
                    - paragraph [ref=f6e1334]:
                      - img "Зал музея с макетом замкового комплекса" [ref=f6e1335]
                  - generic [ref=f6e1336]:
                    - paragraph [ref=f6e1337]:
                      - img "Выставка архивных фотографий замка" [ref=f6e1338]
                    - paragraph [ref=f6e1339]:
                      - img "Архивные снимки Мальборка до и после разрушений" [ref=f6e1340]
                  - paragraph [ref=f6e1341]: "Мальборк состоит из трёх основных частей:"
                  - paragraph [ref=f6e1343]:
                    - 'img "Схема Мальборка: Высокий замок, Средний замок и Предзамок" [ref=f6e1344]'
                  - paragraph [ref=f6e1345]:
                    - strong [ref=f6e1346]: Высокий замок
                    - text: — старейшая часть комплекса, в которой жили братья ордена. Здесь находились монастырские помещения, церковь и внутренний двор с галереями.
                  - paragraph [ref=f6e1347]:
                    - strong [ref=f6e1348]: Средний замок
                    - text: — представительская и административная часть. Здесь располагались дворец великого магистра, залы для приёмов и трапезные.
                  - paragraph [ref=f6e1349]:
                    - strong [ref=f6e1350]: Предзамок
                    - text: — хозяйственная территория с мастерскими, складами и другими постройками, необходимыми для жизни большой крепости.
                  - paragraph [ref=f6e1351]: "Все три части отделены друг от друга рвами, стенами и воротами: попасть из одной в другую можно только через укреплённый проход. Первые ворота встречают поднятой кованой решёткой — её видно прямо над головой, когда проходишь внутрь."
                  - paragraph [ref=f6e1353]:
                    - img "Главные ворота Мальборка с поднятой кованой решёткой" [ref=f6e1354]
                  - paragraph [ref=f6e1355]: После войны с Тевтонским орденом замок не пришлось брать штурмом. В 1457 году польский король Казимир IV Ягеллончик выкупил его у чешских наёмников, которым орден не смог выплатить жалованье. После этого Мальборк более трёхсот лет использовался как одна из королевских резиденций Польши.
                  - paragraph [ref=f6e1356]: "Ещё одна важная дата — 1945 год. В боях за город замок был разрушен примерно наполовину: сильнее всего пострадали церковь Девы Марии и восточная часть Высокого замка. То, что мы видим сегодня, — результат реставрации, которая идёт с конца 1950-х годов и не закончена до сих пор. Поэтому на маршруте попадаются и подлинные средневековые фрагменты, и восстановленные по архивным фотографиям своды, и залы, оставленные намеренно «сырыми», чтобы было видно границу между старым и новым."
                  - heading "Что находится внутри" [level=2] [ref=f6e1357]
                  - paragraph [ref=f6e1358]: Больше всего меня удивило количество помещений. Это не тот замок, где за десять минут проходишь пару залов, после чего остаются только стены.
                  - paragraph [ref=f6e1359]: Маршрут ведёт через дворы и галереи Высокого замка, дворец великих магистров, часовни, трапезные, хозяйственные помещения и музейные выставки. В коллекции музея входят изделия из янтаря, оружие, керамика, монеты, скульптура, мебель и элементы старого оформления замка.
                  - generic [ref=f6e1360]:
                    - paragraph [ref=f6e1361]:
                      - img "Готическая резная сень в зале замка" [ref=f6e1362]
                    - paragraph [ref=f6e1363]:
                      - img "В галереях Мальборка" [ref=f6e1364]
                  - heading "Двор Высокого замка" [level=3] [ref=f6e1365]
                  - paragraph [ref=f6e1366]: Сердце самой старой части замка — квадратный двор, окружённый двухъярусными галереями со стрельчатыми арками. Отсюда попадали в церковь, в капитульный зал и в жилые помещения братьев.
                  - paragraph [ref=f6e1367]: Посреди двора стоит колодец под деревянным навесом. Для замка-монастыря, рассчитанного на осаду, собственный источник воды был вопросом выживания.
                  - generic [ref=f6e1368]:
                    - paragraph [ref=f6e1369]:
                      - 'img "Двор Высокого замка: двухъярусные галереи со стрельчатыми арками" [ref=f6e1370]'
                    - paragraph [ref=f6e1371]:
                      - img "Колодец под деревянным навесом во дворе Высокого замка" [ref=f6e1372]
                  - heading "Большая трапезная" [level=3] [ref=f6e1373]
                  - paragraph [ref=f6e1374]: Одно из главных помещений — Большая трапезная Среднего замка. Её своды опираются всего на три тонкие колонны. Пространство выглядит намного легче, чем ожидаешь от здания с такими массивными внешними стенами.
                  - paragraph [ref=f6e1375]: "Зал вмещал до четырёхсот человек: здесь принимали гостей ордена, устраивали пиры и торжественные приёмы."
                  - generic [ref=f6e1376]:
                    - paragraph [ref=f6e1377]:
                      - 'img "Большая трапезная: своды опираются на три тонкие колонны" [ref=f6e1378]'
                    - paragraph [ref=f6e1379]:
                      - img "Большая трапезная Среднего замка с кольцевыми люстрами" [ref=f6e1380]
                    - paragraph [ref=f6e1381]:
                      - img "Своды Большой трапезной опираются на три тонкие колонны" [ref=f6e1382]
                  - paragraph [ref=f6e1383]: Рядом находится Летняя трапезная. В её стену над камином вмурован каменный пушечный снаряд, с которым связана одна из главных легенд Мальборка.
                  - heading "Зимняя трапезная" [level=3] [ref=f6e1384]
                  - paragraph [ref=f6e1385]: "Ещё один зал, который нам запомнился, — Зимняя трапезная во Дворце великих магистров, в Среднем замке. Она меньше и камернее Большой трапезной: с готическими сводами, тёмными каменными колоннами, камином и необычным разноцветным керамическим полом."
                  - paragraph [ref=f6e1386]: "Зал использовали для трапез и приёмов в холодное время года. Раньше его стены были богато расписаны, но до наших дней сохранились только отдельные фрагменты оформления. Даже без мебели помещение выглядит интересно именно за счёт архитектуры: своды сходятся к тонким колоннам, а рисунок пола делает зал совсем не похожим на привычные замковые интерьеры."
                  - paragraph [ref=f6e1387]: На фотографии этот зал может показаться почти пустым, но вживую хорошо видно, сколько внимания здесь уделяли деталям — от капителей колонн до узора плитки.
                  - paragraph [ref=f6e1389]:
                    - 'img "Зимняя трапезная: тонкие колонны и разноцветный керамический пол" [ref=f6e1390]'
                  - generic [ref=f6e1391]:
                    - paragraph [ref=f6e1392]:
                      - img "Зал с готическим камином в Среднем замке" [ref=f6e1393]
                    - paragraph [ref=f6e1394]:
                      - img "Камин с резным фризом и шахматный керамический пол" [ref=f6e1395]
                  - heading "Как отапливали замок" [level=3] [ref=f6e1396]
                  - paragraph [ref=f6e1397]: "Отдельная вещь, которую легко пропустить, — система отопления. В Мальборке работал гипокауст: в подвале топили печь, раскалённые камни отдавали тепло, а горячий воздух поднимался по каналам в залы через отверстия в полу и сводах. Такие отверстия сохранились до сих пор, и аудиогид специально просит поднять голову."
                  - paragraph [ref=f6e1398]: "Для XIV века это было почти технологическое чудо: большие залы прогревались без открытого огня и дыма внутри."
                  - paragraph [ref=f6e1400]:
                    - img "Отверстие средневековой системы отопления гипокауст в своде зала" [ref=f6e1401]
                  - heading "Замковая кухня" [level=3] [ref=f6e1402]
                  - paragraph [ref=f6e1403]: "Одно из самых атмосферных мест — Большая кухня Среднего замка. Огромный очаг, длинный стол, бочки, корзины, деревянная и глиняная посуда: помещение восстановлено так, будто отсюда только что унесли обед."
                  - paragraph [ref=f6e1404]: Кухня обслуживала сотни человек — братьев ордена, гостей, наёмников и слуг. Рядом видны кладовые и подсобные помещения, а по стенам развешаны вертела, ковши и формы.
                  - generic [ref=f6e1405]:
                    - paragraph [ref=f6e1406]:
                      - 'img "Большая кухня замка: очаг, длинный стол и утварь" [ref=f6e1407]'
                    - paragraph [ref=f6e1408]:
                      - img "Кладовая замковой кухни с бочками и посудой" [ref=f6e1409]
                  - heading "Оружейная и коллекция янтаря" [level=3] [ref=f6e1410]
                  - paragraph [ref=f6e1411]: В Среднем замке и Предзамке размещены основные музейные выставки. Оружейная — доспехи, мечи, арбалеты, шлемы и предметы конской упряжи, часть из которых найдена при раскопках на территории комплекса.
                  - generic [ref=f6e1412]:
                    - paragraph [ref=f6e1413]:
                      - img "Мечи и клинки в оружейной Мальборка" [ref=f6e1414]
                    - paragraph [ref=f6e1415]:
                      - img "Зал с доспехами и шлемами в музее замка" [ref=f6e1416]
                  - paragraph [ref=f6e1417]: "Вторая знаменитая коллекция — янтарь. Мальборк хранит одно из крупнейших янтарных собраний Польши: от кусков сырца с включениями до кубков, шкатулок и алтариков XVII века. Это логично: Балтийское побережье с его янтарными промыслами долго контролировал именно Тевтонский орден."
                  - generic [ref=f6e1418]:
                    - paragraph [ref=f6e1419]:
                      - img "Куски необработанного балтийского янтаря в витрине" [ref=f6e1420]
                    - paragraph [ref=f6e1421]:
                      - img "Зал янтарной коллекции музея Мальборка" [ref=f6e1422]
                  - heading "Церковь Девы Марии и часовня Святой Анны" [level=3] [ref=f6e1423]
                  - paragraph [ref=f6e1424]: "Ещё одна важная часть маршрута — церковь Пресвятой Девы Марии и расположенная под ней часовня Святой Анны. Часовня использовалась как место погребения великих магистров ордена: в полу видны каменные плиты над захоронениями."
                  - generic [ref=f6e1425]:
                    - paragraph [ref=f6e1426]:
                      - 'img "Часовня Святой Анны: надгробные плиты и витраж" [ref=f6e1427]'
                    - paragraph [ref=f6e1428]:
                      - img "Часовня Святой Анны с надгробными плитами великих магистров" [ref=f6e1429]
                  - paragraph [ref=f6e1430]: Снаружи, в нише восточного фасада церкви, стоит восьмиметровая фигура Мадонны с Младенцем, выложенная разноцветной мозаикой. Оригинал XIV века был уничтожен в 1945 году; фигуру воссоздали и вернули на место в 2014 году.
                  - generic [ref=f6e1431]:
                    - paragraph [ref=f6e1432]:
                      - img "Восьмиметровая мозаичная Мадонна в нише фасада костёла" [ref=f6e1433]
                    - paragraph [ref=f6e1434]:
                      - img "Мозаичная фигура Мадонны с Младенцем на фасаде костёла" [ref=f6e1435]
                  - paragraph [ref=f6e1436]: Внутри церкви сохранился резной золочёный алтарь и фрагменты средневековой росписи, а вход в неё оформлен богатым порталом — Золотыми воротами.
                  - generic [ref=f6e1437]:
                    - paragraph [ref=f6e1438]:
                      - img "Резной золочёный алтарь в замковой церкви" [ref=f6e1439]
                    - paragraph [ref=f6e1440]:
                      - img "Золотые ворота — резной портал замковой церкви" [ref=f6e1441]
                  - heading "Данскер, умывальня и другие бытовые детали" [level=3] [ref=f6e1442]
                  - paragraph [ref=f6e1443]: "Отдельно стоящая башня, соединённая с замком длинным крытым переходом на кирпичных арках, — это данскер, орденский туалет. Его выносили за стены и ставили над водой или рвом, а переход одновременно служил последним укреплением: в случае прорыва его можно было оборонять."
                  - paragraph [ref=f6e1445]:
                    - img "Крытый переход на кирпичных арках к башне-данскеру" [ref=f6e1446]
                  - paragraph [ref=f6e1447]: Рядом с трапезными сохранилась средневековая умывальня — каменное корыто с латунными кранами прямо в стене. По уставу ордена перед едой полагалось мыть руки, и для этого сделали отдельную нишу с проточной водой.
                  - paragraph [ref=f6e1449]:
                    - img "Средневековая умывальня с латунными кранами в стене" [ref=f6e1450]
                  - paragraph [ref=f6e1451]: А в одном из помещений стены целиком выложены голландскими изразцами — синий рисунок по белому фону. Это уже не орденское время, а более поздние переделки, когда замок был королевской резиденцией.
                  - generic [ref=f6e1452]:
                    - paragraph [ref=f6e1453]:
                      - img "Стена, целиком выложенная голландскими изразцами" [ref=f6e1454]
                    - paragraph [ref=f6e1455]:
                      - img "Ниша, облицованная голландскими изразцами" [ref=f6e1456]
                  - paragraph [ref=f6e1457]: "Своды кое-где сохранили роспись: растительный орнамент, звери, геральдика. После белёных стен реставрации такие фрагменты особенно заметны."
                  - generic [ref=f6e1458]:
                    - paragraph [ref=f6e1459]:
                      - 'img "Роспись свода: растительный орнамент и звери" [ref=f6e1460]'
                    - paragraph [ref=f6e1461]:
                      - img "Фрагмент средневековой росписи на стене" [ref=f6e1462]
                  - paragraph [ref=f6e1463]: Здесь много восстановленных помещений, но замок не воспринимается как полностью современная декорация. Внутри сохранились исторические фрагменты, а в некоторых местах можно увидеть, как менялось здание после войн, разрушений и реконструкций.
                  - generic [ref=f6e1464]:
                    - paragraph [ref=f6e1465]:
                      - img "Внутренний двор с колодцем под деревянным навесом" [ref=f6e1466]
                    - paragraph [ref=f6e1467]:
                      - img "Сад и каменная кладка у крепостных стен" [ref=f6e1468]
                    - paragraph [ref=f6e1469]:
                      - img "Плющ на старой каменной кладке замка" [ref=f6e1470]
                  - generic [ref=f6e1471]:
                    - paragraph [ref=f6e1472]:
                      - img "Сводчатая галерея с пушками" [ref=f6e1473]
                    - paragraph [ref=f6e1474]:
                      - img "Дворец великих магистров с эркерами со стороны рва" [ref=f6e1475]
                  - heading "Легенда о пушечном ядре" [level=2] [ref=f6e1476]
                  - paragraph [ref=f6e1477]: Одна из самых известных историй Мальборка связана с осадой замка в 1410 году.
                  - paragraph [ref=f6e1478]: После победы под Грюнвальдом польско-литовское войско под командованием Владислава Ягайло подошло к Мальборку, но крепость взять не смогло. Согласно легенде, во время осады командование Тевтонского ордена собралось в Летней трапезной.
                  - paragraph [ref=f6e1479]: Войска Ягайло якобы узнали об этом и попытались попасть пушечным ядром в единственную колонну, поддерживающую своды зала. Если бы колонна рухнула, потолок мог обвалиться вместе со всеми находившимися внутри людьми.
                  - paragraph [ref=f6e1480]: Ядро пролетело рядом с колонной и попало в стену. Сейчас над камином действительно находится каменный шар, напоминающий об этой истории. Сам музей осторожно формулирует её как передаваемое из поколения в поколение предание, а не полностью доказанный эпизод осады.
                  - heading "Побег литовского князя Кейстута" [level=2] [ref=f6e1481]
                  - paragraph [ref=f6e1482]: Другая история связана с литовским князем Кейстутом.
                  - paragraph [ref=f6e1483]: В 1361 году он попал в плен к крестоносцам и был заключён в Мальборке. Согласно более поздней традиции, Кейстут сумел склонить на свою сторону одного из охранников. Тот достал для него плащ рыцаря ордена и помог выйти из замка. После побега князь вернулся в Литву.
                  - paragraph [ref=f6e1484]: История со временем обросла подробностями, поэтому сейчас сложно отделить подтверждённые события от легенды. Однако сам факт заключения Кейстута в Мальборке и его последующего побега упоминается в исторических материалах города.
                  - paragraph [ref=f6e1486]:
                    - img "Кованая дверь в готическом портале" [ref=f6e1487]
                  - heading "Аудиогид в замке Мальборк" [level=2] [ref=f6e1488]
                  - paragraph [ref=f6e1489]: Отдельно стоит сказать про аудиогид. На текущий момент это один из лучших аудиогидов, которыми мы пользовались в польских замках.
                  - paragraph [ref=f6e1490]: Он не просто перечисляет даты и имена. В рассказе есть музыка, звуки и небольшие сюжетные эпизоды. Аудиогид сам подсказывает, куда идти дальше, поэтому не приходится постоянно смотреть на карту или искать номер следующего помещения.
                  - paragraph [ref=f6e1491]: Можно двигаться в своём темпе, задерживаться в понравившихся залах и не подстраиваться под экскурсионную группу.
                  - paragraph [ref=f6e1492]: Есть полноценная версия на русском языке. Аудиогид входит в стоимость исторического маршрута. Кроме русского доступны польский, английский, немецкий, французский, испанский, итальянский, чешский, литовский, украинский и другие языки.
                  - paragraph [ref=f6e1493]:
                    - text: Мы были также в замке
                    - link "Ксёнж" [ref=f6e1494] [cursor=pointer]:
                      - /url: https://metravel.by/travels/zamok-ksenzh-v-polshe-istoriia-kak-dobratsia-chto-posmotret-tainy-legendy-i-podzemelia
                    - text: ", который нам очень понравился, но сравнивать их сложно. Ксёнж больше воспринимается как дворец с интерьерами разных эпох. Мальборк — это монастырь, крепость, резиденция и отдельный средневековый город внутри стен."
                  - heading "Где поесть" [level=2] [ref=f6e1495]
                  - paragraph [ref=f6e1496]: На территории замка есть ресторан, но мы в него не заходили, поэтому ничего не могу сказать ни про кухню, ни про цены.
                  - paragraph [ref=f6e1497]: Также внутри работает небольшое кафе. Там можно взять кофе, мороженое и десерты. Само кафе находится в замковых помещениях, поэтому оно хорошо вписывается в маршрут. Мы сделали там небольшой перерыв, после чего продолжили осмотр.
                  - generic [ref=f6e1498]:
                    - paragraph [ref=f6e1499]:
                      - img "Кафе в сводчатых замковых помещениях" [ref=f6e1500]
                    - paragraph [ref=f6e1501]:
                      - img "Перерыв на кофе внутри замка" [ref=f6e1502]
                  - paragraph [ref=f6e1503]: "Уже после посещения замка мы зашли в заведение самообслуживания рядом с парковкой. Оно было устроено примерно как столовая: берёшь поднос и выбираешь готовые блюда. Мы брали котлету по-киевски, и всё оказалось действительно вкусным."
                  - heading "Билеты и часы работы в 2026 году" [level=2] [ref=f6e1504]
                  - paragraph [ref=f6e1505]:
                    - text: В весенне-летнем сезоне, с 25 апреля по 30 сентября 2026 года, полный
                    - strong [ref=f6e1506]: исторический маршрут
                    - text: открыт со вторника по воскресенье с 09:00 до 20:00. Последний вход — в 16:30, а музейные интерьеры и выставки закрываются в 19:00.
                  - paragraph [ref=f6e1507]: "Стоимость исторического маршрута:"
                  - list [ref=f6e1508]:
                    - listitem [ref=f6e1509]:
                      - strong [ref=f6e1510]: обычный билет — 80 злотых;
                    - listitem [ref=f6e1511]:
                      - strong [ref=f6e1512]: льготный билет — 60 злотых.
                  - paragraph [ref=f6e1513]: В стоимость входит экскурсия на польском языке или аудиогид, в том числе на русском. Полный маршрут включает внутренние помещения и выставки.
                  - paragraph [ref=f6e1514]:
                    - text: Есть также сокращённый
                    - strong [ref=f6e1515]: прогулочный маршрут
                    - text: ", который проходит через дворы, террасы, сады, рвы и часть укреплений, но не включает основные интерьеры и музейные выставки. Его стоимость в 2026 году составляет 35 злотых за обычный билет и 25 злотых за льготный."
                  - paragraph [ref=f6e1516]: По понедельникам прогулочный маршрут можно посетить бесплатно. Бесплатный билет необходимо получить непосредственно в кассе. Главные интерьеры в этот день недоступны.
                  - paragraph [ref=f6e1517]: "В осенне-зимнем сезоне маршрут короче, а музей закрывается раньше — ориентируйтесь на 10:00–15:00 с последним входом за 2–3 часа до закрытия. Точное расписание перед поездкой лучше проверить ещё раз: режим работы меняется в зависимости от сезона, праздников и специальных мероприятий."
                  - paragraph [ref=f6e1518]: "Билеты онлайн стоит брать заранее, особенно летом: у музея есть лимит посетителей в час, и на популярное время места заканчиваются."
                  - paragraph [ref=f6e1519]:
                    - link "Официальный сайт замка Мальборк" [ref=f6e1520] [cursor=pointer]:
                      - /url: https://zamek.malbork.pl/
                  - paragraph [ref=f6e1521]:
                    - link "Официальная покупка билетов онлайн" [ref=f6e1522] [cursor=pointer]:
                      - /url: https://bilety.zamek.malbork.pl/
                  - heading "Сколько времени выделить" [level=2] [ref=f6e1523]
                  - paragraph [ref=f6e1524]: Я бы планировала не меньше четырёх часов. У нас на посещение ушло около половины дня, и при этом мы не рассматривали подробно каждый экспонат.
                  - paragraph [ref=f6e1525]: Замок большой, по маршруту приходится много ходить, подниматься по лестницам и переходить между разными частями комплекса. Лучше приехать утром, надеть удобную обувь и не планировать сразу после него ещё несколько крупных музеев.
                  - paragraph [ref=f6e1526]: "Апрельский будний день оказался для нас хорошим временем: людей было немного, в кассах не было очередей, а внутри можно было спокойно останавливаться и слушать аудиогид."
                  - paragraph [ref=f6e1527]: Летом я бы обязательно купила билеты заранее.
                  - heading "Как добраться" [level=2] [ref=f6e1528]
                  - list [ref=f6e1529]:
                    - listitem [ref=f6e1530]:
                      - strong [ref=f6e1531]: "Из Гданьска на машине:"
                      - text: около 60 км по S7 и DK22, примерно час с учётом съездов и городских участков.
                    - listitem [ref=f6e1532]:
                      - strong [ref=f6e1533]: "Из Гданьска на поезде:"
                      - text: прямые поезда с вокзала Gdańsk Główny идут 35–50 минут и ходят часто. От вокзала Мальборка до замка — около 10 минут пешком.
                    - listitem [ref=f6e1534]:
                      - strong [ref=f6e1535]: "Из Варшавы:"
                      - text: около 290 км, порядка 3 часов на машине; поезда идут 2,5–3 часа.
                    - listitem [ref=f6e1536]:
                      - strong [ref=f6e1537]: "Из Эльблонга:"
                      - text: 30 км, меньше получаса — удобно, если едете вдоль Вислинского залива.
                  - paragraph [ref=f6e1538]: "Парковки: несколько платных стоянок вдоль улицы Wałowa и крытая парковка недалеко от входа. В будний день весной мест хватало."
                  - paragraph [ref=f6e1539]: "В Мальборке можно остановиться на ночь: в городе есть несколько гостиниц прямо у стен замка, и вечером, когда туристические автобусы уезжают, крепость в подсветке производит совсем другое впечатление."
                  - heading "Что ещё посмотреть в Мальборке" [level=2] [ref=f6e1540]
                  - paragraph [ref=f6e1541]: "После замка стоит пройти к противоположному берегу Ногата. Именно оттуда открывается общий вид на весь комплекс и становится понятен его настоящий размер: почти километр кирпичных стен, отражающихся в воде."
                  - generic [ref=f6e1542]:
                    - paragraph [ref=f6e1543]:
                      - img "Панорама всего комплекса Мальборка с противоположного берега Ногата" [ref=f6e1544]
                    - paragraph [ref=f6e1545]:
                      - img "Замок Мальборк и пристань на Ногате" [ref=f6e1546]
                  - paragraph [ref=f6e1547]: "В самом городе сохранилось несколько средневековых объектов:"
                  - list [ref=f6e1548]:
                    - listitem [ref=f6e1549]: Мариацкие ворота;
                    - listitem [ref=f6e1550]: Гончарные ворота;
                    - listitem [ref=f6e1551]: старая ратуша;
                    - listitem [ref=f6e1552]: церковь Святого Иоанна Крестителя;
                    - listitem [ref=f6e1553]: участки городских оборонительных стен.
                  - paragraph [ref=f6e1554]: В туристический сезон по Ногату проводятся прогулочные рейсы. В городе также работают Музей города Мальборка и Динопарк, который в первую очередь рассчитан на семьи с детьми.
                  - paragraph [ref=f6e1555]: Но после нескольких часов в замке у нас уже не осталось желания идти ещё в один музей. Мы немного прогулялись возле реки, поели и вернулись обратно на побережье.
                  - 'heading "Билет на три замка: Мальборк, Штум и Квидзын" [level=2] [ref=f6e1556]'
                  - paragraph [ref=f6e1557]:
                    - text: Раньше можно было встретить информацию о комбинированном билете на два замка. Сейчас музей предлагает
                    - strong [ref=f6e1558]: билет на три замка
                    - text: ": Мальборк, Штум и Квидзын."
                  - paragraph [ref=f6e1559]: Билет действует 14 дней и позволяет по одному разу посетить каждый объект. В 2026 году он стоит 105 злотых для взрослого и 75 злотых по льготному тарифу. В Мальборке в стоимость входит исторический маршрут с аудиогидом или польским экскурсоводом, а в Штуме и Квидзыне — аудиогид.
                  - heading "Замок в Штуме" [level=3] [ref=f6e1560]
                  - paragraph [ref=f6e1561]: Штум находится примерно в 14 километрах к югу от Мальборка. Его замок намного меньше и сохранился хуже, но это логичное продолжение маршрута.
                  - paragraph [ref=f6e1562]: Он строился в конце XIV — начале XV века и использовался как загородная резиденция великих магистров. Позднее здесь размещались польские старосты. Сейчас внутри работает выставка, посвящённая истории замка и его реконструкции.
                  - paragraph [ref=f6e1563]: Штум можно добавить в тот же день, но только если начать осмотр Мальборка рано утром и не задерживаться в каждом зале.
                  - heading "Замок в Квидзыне" [level=3] [ref=f6e1564]
                  - paragraph [ref=f6e1565]: Замок в Квидзыне интересен тем, что соединён с готическим кафедральным собором. Его самая узнаваемая часть — большая башня-данскер, или гданиско, соединённая с основным зданием длинной крытой галереей.
                  - paragraph [ref=f6e1566]: Внешне Квидзын сильно отличается от Мальборка, поэтому он не воспринимается как уменьшенная копия того же замка. Музей называет комплекс замка и собора одним из наиболее узнаваемых готических сооружений Польши.
                  - paragraph [ref=f6e1567]: Три замка лучше распределить на два дня. Мальборку стоит отдать отдельный день или хотя бы его большую часть, а Штум и Квидзын объединить в следующий маршрут.
                  - heading "Стоит ли ехать в замок Мальборк" [level=2] [ref=f6e1568]
                  - paragraph [ref=f6e1569]: Даже если на фотографиях Мальборк не кажется вам особенно интересным, внутри он может полностью изменить впечатление.
                  - paragraph [ref=f6e1570]: Мне казалось, что я примерно представляю, что там будет. На месте оказалось, что фотографии показывают только внешние стены и почти ничего не передают о внутренних пространствах.
                  - paragraph [ref=f6e1572]:
                    - img "На мосту через Ногат, за спиной — Мальборк" [ref=f6e1573]
                  - paragraph [ref=f6e1574]: Здесь стоит ехать не только ради статуса крупнейшего кирпичного замка или объекта ЮНЕСКО. В Мальборке действительно интересно ходить по залам, слушать истории и постепенно разбираться, как был устроен этот огромный комплекс.
                  - paragraph [ref=f6e1575]: Из польских замков, в которых мы успели побывать, Мальборк запомнился прежде всего масштабом и аудиогидом. Он оказался намного интереснее, чем я ожидала, и точно стоил отдельной поездки с Балтийского побережья.
                  - heading "Что рядом" [level=2] [ref=f6e1576]
                  - list [ref=f6e1577]:
                    - listitem [ref=f6e1578]:
                      - 'link "Польша за 4 дня: Сувалки — Эльблонг — Гданьск — Леба" [ref=f6e1579] [cursor=pointer]':
                        - /url: https://metravel.by/travels/puteshestvie-v-polshu-na-4-dnia-marshrut-minsk-suvalki-elblong-gdansk-leba
                      - text: — маршрут, в который Мальборк вписывается по дороге.
                    - listitem [ref=f6e1580]:
                      - 'link "Замок Ксёнж: история, тайны, легенды и подземелья" [ref=f6e1581] [cursor=pointer]':
                        - /url: https://metravel.by/travels/zamok-ksenzh-v-polshe-istoriia-kak-dobratsia-chto-posmotret-tainy-legendy-i-podzemelia
                      - text: — второй большой замок Польши, но совсем другого характера.
                    - listitem [ref=f6e1582]:
