                - 'button "Замок Мальборк: крупнейшая кирпичная крепость мира — путеводитель, развёрнуто" [expanded] [ref=f6e220] [cursor=pointer]':
                  - generic [ref=f6e221]:
                    - 'img "Замок Мальборк: крупнейшая кирпичная крепость мира — путеводитель" [ref=f6e224]'
                    - generic [ref=f6e225]: "Замок Мальборк: крупнейшая кирпичная крепость мира — путеводитель"
                - generic [ref=f6e230]:
                  - generic [ref=f6e231]: "лучший сезон: апрель · ~16 мин чтения"
                  - heading "Содержание маршрута" [level=2] [ref=f6e233]
                  - generic [ref=f6e237]:
                    - paragraph [ref=f6e238]: В замок Мальборк мы съездили во время нашего длительного пребывания на Балтике. От Гданьска до него около 60 километров по трассе S7 и DK22, дорога на машине занимает примерно час, хотя летом и в выходные лучше закладывать больше времени.
                    - paragraph [ref=f6e239]: "Мы приехали в апреле, в обычный будний день. Рядом с замком есть несколько городских и частных парковок. Мы оставили машину на крытой парковке недалеко от входа. Свободных мест было достаточно, очередей возле касс тоже не было: спокойно купили билеты, получили аудиогиды и пошли внутрь."
                    - paragraph [ref=f6e240]: Летом ситуация может быть совсем другой. У музея действует ограничение на количество посетителей в час, поэтому в высокий сезон билеты советуют приобретать заранее.
                    - paragraph [ref=f6e242]:
                      - 'img "Замок Мальборк с воды: почти километр кирпичных стен вдоль Ногата" [ref=f6e243]'
                    - heading "Замок, который я раньше недооценивала" [level=2] [ref=f6e244]
                    - paragraph [ref=f6e245]: До этой поездки я не совсем понимала, почему Мальборк считается настолько важным замком.
                    - paragraph [ref=f6e246]:
                      - text: На фотографиях он казался мне большим, но довольно однообразным. Красный кирпич, стены, башни. Почему-то внешне я сравнивала его с
                      - link "Лидским замком" [ref=f6e247] [cursor=pointer]:
                        - /url: https://metravel.by/travels/lida-lidskiy-zamok
                      - text: в Беларуси и думала, что внутри будет несколько восстановленных помещений, музей и в основном пустые дворы.
                    - paragraph [ref=f6e249]:
                      - img "Кирпичные стены и башни Мальборка" [ref=f6e250]
                    - paragraph [ref=f6e251]: В итоге я редко настолько ошибалась в ожиданиях от места.
                    - paragraph [ref=f6e252]: За стенами скрывается не просто крепость, а целый комплекс с переходами, внутренними дворами, жилыми залами, часовнями, галереями и музейными коллекциями. Чем дальше проходишь по маршруту, тем больше понимаешь его настоящий масштаб.
                    - generic [ref=f6e253]:
                      - paragraph [ref=f6e254]:
                        - img "Галерея-клуатр Высокого замка" [ref=f6e255]
                      - paragraph [ref=f6e256]:
                        - img "Вид из окна на внутренний двор с черепичными крышами" [ref=f6e257]
                    - generic [ref=f6e258]:
                      - paragraph [ref=f6e259]:
                        - img "Интерьер замковой церкви Девы Марии" [ref=f6e260]
                      - paragraph [ref=f6e261]:
                        - img "Зал с готическими сводами и узорным керамическим полом" [ref=f6e262]
                    - paragraph [ref=f6e263]: На осмотр у нас ушло около половины дня. И это без долгого обеда в ресторане и без попытки подробно рассмотреть каждый музейный экспонат.
                    - heading "Почему Мальборк такой большой" [level=2] [ref=f6e264]
                    - paragraph [ref=f6e265]: Строительство замка началось во второй половине XIII века, приблизительно в 1276 году. После того как в 1309 году сюда перенесли резиденцию великого магистра Тевтонского ордена, крепость начали расширять. Мальборк стал не только монастырём и военным укреплением, но также административным центром государства ордена.
                    - paragraph [ref=f6e266]: Комплекс занимает около 20–21 гектара и считается крупнейшим кирпичным замком в мире. В 1997 году его внесли в список Всемирного наследия ЮНЕСКО как один из наиболее полных примеров готической архитектуры Тевтонского ордена.
                    - generic [ref=f6e267]:
                      - paragraph [ref=f6e268]:
                        - 'img "Макет Мальборка: три части комплекса и рвы" [ref=f6e269]'
                      - paragraph [ref=f6e270]:
                        - img "Зал музея с макетом замкового комплекса" [ref=f6e271]
                    - generic [ref=f6e272]:
                      - paragraph [ref=f6e273]:
                        - img "Выставка архивных фотографий замка" [ref=f6e274]
                      - paragraph [ref=f6e275]:
                        - img "Архивные снимки Мальборка до и после разрушений" [ref=f6e276]
                    - paragraph [ref=f6e277]: "Мальборк состоит из трёх основных частей:"
                    - paragraph [ref=f6e279]:
                      - 'img "Схема Мальборка: Высокий замок, Средний замок и Предзамок" [ref=f6e280]'
                    - paragraph [ref=f6e281]:
                      - strong [ref=f6e282]: Высокий замок
                      - text: — старейшая часть комплекса, в которой жили братья ордена. Здесь находились монастырские помещения, церковь и внутренний двор с галереями.
                    - paragraph [ref=f6e283]:
                      - strong [ref=f6e284]: Средний замок
                      - text: — представительская и административная часть. Здесь располагались дворец великого магистра, залы для приёмов и трапезные.
                    - paragraph [ref=f6e285]:
                      - strong [ref=f6e286]: Предзамок
                      - text: — хозяйственная территория с мастерскими, складами и другими постройками, необходимыми для жизни большой крепости.
                    - paragraph [ref=f6e287]: "Все три части отделены друг от друга рвами, стенами и воротами: попасть из одной в другую можно только через укреплённый проход. Первые ворота встречают поднятой кованой решёткой — её видно прямо над головой, когда проходишь внутрь."
                    - paragraph [ref=f6e289]:
                      - img "Главные ворота Мальборка с поднятой кованой решёткой" [ref=f6e290]
                    - paragraph [ref=f6e291]: После войны с Тевтонским орденом замок не пришлось брать штурмом. В 1457 году польский король Казимир IV Ягеллончик выкупил его у чешских наёмников, которым орден не смог выплатить жалованье. После этого Мальборк более трёхсот лет использовался как одна из королевских резиденций Польши.
                    - paragraph [ref=f6e292]: "Ещё одна важная дата — 1945 год. В боях за город замок был разрушен примерно наполовину: сильнее всего пострадали церковь Девы Марии и восточная часть Высокого замка. То, что мы видим сегодня, — результат реставрации, которая идёт с конца 1950-х годов и не закончена до сих пор. Поэтому на маршруте попадаются и подлинные средневековые фрагменты, и восстановленные по архивным фотографиям своды, и залы, оставленные намеренно «сырыми», чтобы было видно границу между старым и новым."
                    - heading "Что находится внутри" [level=2] [ref=f6e293]
                    - paragraph [ref=f6e294]: Больше всего меня удивило количество помещений. Это не тот замок, где за десять минут проходишь пару залов, после чего остаются только стены.
                    - paragraph [ref=f6e295]: Маршрут ведёт через дворы и галереи Высокого замка, дворец великих магистров, часовни, трапезные, хозяйственные помещения и музейные выставки. В коллекции музея входят изделия из янтаря, оружие, керамика, монеты, скульптура, мебель и элементы старого оформления замка.
                    - generic [ref=f6e296]:
                      - paragraph [ref=f6e297]:
                        - img "Готическая резная сень в зале замка" [ref=f6e298]
                      - paragraph [ref=f6e299]:
                        - img "В галереях Мальборка" [ref=f6e300]
                    - heading "Двор Высокого замка" [level=3] [ref=f6e301]
                    - paragraph [ref=f6e302]: Сердце самой старой части замка — квадратный двор, окружённый двухъярусными галереями со стрельчатыми арками. Отсюда попадали в церковь, в капитульный зал и в жилые помещения братьев.
                    - paragraph [ref=f6e303]: Посреди двора стоит колодец под деревянным навесом. Для замка-монастыря, рассчитанного на осаду, собственный источник воды был вопросом выживания.
                    - generic [ref=f6e304]:
                      - paragraph [ref=f6e305]:
                        - 'img "Двор Высокого замка: двухъярусные галереи со стрельчатыми арками" [ref=f6e306]'
                      - paragraph [ref=f6e307]:
                        - img "Колодец под деревянным навесом во дворе Высокого замка" [ref=f6e308]
                    - heading "Большая трапезная" [level=3] [ref=f6e309]
                    - paragraph [ref=f6e310]: Одно из главных помещений — Большая трапезная Среднего замка. Её своды опираются всего на три тонкие колонны. Пространство выглядит намного легче, чем ожидаешь от здания с такими массивными внешними стенами.
                    - paragraph [ref=f6e311]: "Зал вмещал до четырёхсот человек: здесь принимали гостей ордена, устраивали пиры и торжественные приёмы."
                    - generic [ref=f6e312]:
                      - paragraph [ref=f6e313]:
                        - 'img "Большая трапезная: своды опираются на три тонкие колонны" [ref=f6e314]'
                      - paragraph [ref=f6e315]:
                        - img "Большая трапезная Среднего замка с кольцевыми люстрами" [ref=f6e316]
                      - paragraph [ref=f6e317]:
                        - img "Своды Большой трапезной опираются на три тонкие колонны" [ref=f6e318]
                    - paragraph [ref=f6e319]: Рядом находится Летняя трапезная. В её стену над камином вмурован каменный пушечный снаряд, с которым связана одна из главных легенд Мальборка.
                    - heading "Зимняя трапезная" [level=3] [ref=f6e320]
                    - paragraph [ref=f6e321]: "Ещё один зал, который нам запомнился, — Зимняя трапезная во Дворце великих магистров, в Среднем замке. Она меньше и камернее Большой трапезной: с готическими сводами, тёмными каменными колоннами, камином и необычным разноцветным керамическим полом."
                    - paragraph [ref=f6e322]: "Зал использовали для трапез и приёмов в холодное время года. Раньше его стены были богато расписаны, но до наших дней сохранились только отдельные фрагменты оформления. Даже без мебели помещение выглядит интересно именно за счёт архитектуры: своды сходятся к тонким колоннам, а рисунок пола делает зал совсем не похожим на привычные замковые интерьеры."
                    - paragraph [ref=f6e323]: На фотографии этот зал может показаться почти пустым, но вживую хорошо видно, сколько внимания здесь уделяли деталям — от капителей колонн до узора плитки.
                    - paragraph [ref=f6e325]:
                      - 'img "Зимняя трапезная: тонкие колонны и разноцветный керамический пол" [ref=f6e326]'
                    - generic [ref=f6e327]:
                      - paragraph [ref=f6e328]:
                        - img "Зал с готическим камином в Среднем замке" [ref=f6e329]
                      - paragraph [ref=f6e330]:
                        - img "Камин с резным фризом и шахматный керамический пол" [ref=f6e331]
                    - heading "Как отапливали замок" [level=3] [ref=f6e332]
                    - paragraph [ref=f6e333]: "Отдельная вещь, которую легко пропустить, — система отопления. В Мальборке работал гипокауст: в подвале топили печь, раскалённые камни отдавали тепло, а горячий воздух поднимался по каналам в залы через отверстия в полу и сводах. Такие отверстия сохранились до сих пор, и аудиогид специально просит поднять голову."
                    - paragraph [ref=f6e334]: "Для XIV века это было почти технологическое чудо: большие залы прогревались без открытого огня и дыма внутри."
                    - paragraph [ref=f6e336]:
                      - img "Отверстие средневековой системы отопления гипокауст в своде зала" [ref=f6e337]
                    - heading "Замковая кухня" [level=3] [ref=f6e338]
                    - paragraph [ref=f6e339]: "Одно из самых атмосферных мест — Большая кухня Среднего замка. Огромный очаг, длинный стол, бочки, корзины, деревянная и глиняная посуда: помещение восстановлено так, будто отсюда только что унесли обед."
                    - paragraph [ref=f6e340]: Кухня обслуживала сотни человек — братьев ордена, гостей, наёмников и слуг. Рядом видны кладовые и подсобные помещения, а по стенам развешаны вертела, ковши и формы.
                    - generic [ref=f6e341]:
                      - paragraph [ref=f6e342]:
                        - 'img "Большая кухня замка: очаг, длинный стол и утварь" [ref=f6e343]'
                      - paragraph [ref=f6e344]:
                        - img "Кладовая замковой кухни с бочками и посудой" [ref=f6e345]
                    - heading "Оружейная и коллекция янтаря" [level=3] [ref=f6e346]
                    - paragraph [ref=f6e347]: В Среднем замке и Предзамке размещены основные музейные выставки. Оружейная — доспехи, мечи, арбалеты, шлемы и предметы конской упряжи, часть из которых найдена при раскопках на территории комплекса.
                    - generic [ref=f6e348]:
                      - paragraph [ref=f6e349]:
                        - img "Мечи и клинки в оружейной Мальборка" [ref=f6e350]
                      - paragraph [ref=f6e351]:
                        - img "Зал с доспехами и шлемами в музее замка" [ref=f6e352]
                    - paragraph [ref=f6e353]: "Вторая знаменитая коллекция — янтарь. Мальборк хранит одно из крупнейших янтарных собраний Польши: от кусков сырца с включениями до кубков, шкатулок и алтариков XVII века. Это логично: Балтийское побережье с его янтарными промыслами долго контролировал именно Тевтонский орден."
                    - generic [ref=f6e354]:
                      - paragraph [ref=f6e355]:
                        - img "Куски необработанного балтийского янтаря в витрине" [ref=f6e356]
                      - paragraph [ref=f6e357]:
                        - img "Зал янтарной коллекции музея Мальборка" [ref=f6e358]
                    - heading "Церковь Девы Марии и часовня Святой Анны" [level=3] [ref=f6e359]
                    - paragraph [ref=f6e360]: "Ещё одна важная часть маршрута — церковь Пресвятой Девы Марии и расположенная под ней часовня Святой Анны. Часовня использовалась как место погребения великих магистров ордена: в полу видны каменные плиты над захоронениями."
                    - generic [ref=f6e361]:
                      - paragraph [ref=f6e362]:
                        - 'img "Часовня Святой Анны: надгробные плиты и витраж" [ref=f6e363]'
                      - paragraph [ref=f6e364]:
                        - img "Часовня Святой Анны с надгробными плитами великих магистров" [ref=f6e365]
                    - paragraph [ref=f6e366]: Снаружи, в нише восточного фасада церкви, стоит восьмиметровая фигура Мадонны с Младенцем, выложенная разноцветной мозаикой. Оригинал XIV века был уничтожен в 1945 году; фигуру воссоздали и вернули на место в 2014 году.
                    - generic [ref=f6e367]:
                      - paragraph [ref=f6e368]:
                        - img "Восьмиметровая мозаичная Мадонна в нише фасада костёла" [ref=f6e369]
                      - paragraph [ref=f6e370]:
                        - img "Мозаичная фигура Мадонны с Младенцем на фасаде костёла" [ref=f6e371]
                    - paragraph [ref=f6e372]: Внутри церкви сохранился резной золочёный алтарь и фрагменты средневековой росписи, а вход в неё оформлен богатым порталом — Золотыми воротами.
                    - generic [ref=f6e373]:
                      - paragraph [ref=f6e374]:
                        - img "Резной золочёный алтарь в замковой церкви" [ref=f6e375]
                      - paragraph [ref=f6e376]:
                        - img "Золотые ворота — резной портал замковой церкви" [ref=f6e377]
                    - heading "Данскер, умывальня и другие бытовые детали" [level=3] [ref=f6e378]
                    - paragraph [ref=f6e379]: "Отдельно стоящая башня, соединённая с замком длинным крытым переходом на кирпичных арках, — это данскер, орденский туалет. Его выносили за стены и ставили над водой или рвом, а переход одновременно служил последним укреплением: в случае прорыва его можно было оборонять."
                    - paragraph [ref=f6e381]:
                      - img "Крытый переход на кирпичных арках к башне-данскеру" [ref=f6e382]
                    - paragraph [ref=f6e383]: Рядом с трапезными сохранилась средневековая умывальня — каменное корыто с латунными кранами прямо в стене. По уставу ордена перед едой полагалось мыть руки, и для этого сделали отдельную нишу с проточной водой.
                    - paragraph [ref=f6e385]:
                      - img "Средневековая умывальня с латунными кранами в стене" [ref=f6e386]
                    - paragraph [ref=f6e387]: А в одном из помещений стены целиком выложены голландскими изразцами — синий рисунок по белому фону. Это уже не орденское время, а более поздние переделки, когда замок был королевской резиденцией.
                    - generic [ref=f6e388]:
                      - paragraph [ref=f6e389]:
                        - img "Стена, целиком выложенная голландскими изразцами" [ref=f6e390]
                      - paragraph [ref=f6e391]:
                        - img "Ниша, облицованная голландскими изразцами" [ref=f6e392]
                    - paragraph [ref=f6e393]: "Своды кое-где сохранили роспись: растительный орнамент, звери, геральдика. После белёных стен реставрации такие фрагменты особенно заметны."
                    - generic [ref=f6e394]:
                      - paragraph [ref=f6e395]:
                        - 'img "Роспись свода: растительный орнамент и звери" [ref=f6e396]'
                      - paragraph [ref=f6e397]:
                        - img "Фрагмент средневековой росписи на стене" [ref=f6e398]
                    - paragraph [ref=f6e399]: Здесь много восстановленных помещений, но замок не воспринимается как полностью современная декорация. Внутри сохранились исторические фрагменты, а в некоторых местах можно увидеть, как менялось здание после войн, разрушений и реконструкций.
                    - generic [ref=f6e400]:
                      - paragraph [ref=f6e401]:
                        - img "Внутренний двор с колодцем под деревянным навесом" [ref=f6e402]
                      - paragraph [ref=f6e403]:
                        - img "Сад и каменная кладка у крепостных стен" [ref=f6e404]
                      - paragraph [ref=f6e405]:
                        - img "Плющ на старой каменной кладке замка" [ref=f6e406]
                    - generic [ref=f6e407]:
                      - paragraph [ref=f6e408]:
                        - img "Сводчатая галерея с пушками" [ref=f6e409]
                      - paragraph [ref=f6e410]:
                        - img "Дворец великих магистров с эркерами со стороны рва" [ref=f6e411]
                    - heading "Легенда о пушечном ядре" [level=2] [ref=f6e412]
                    - paragraph [ref=f6e413]: Одна из самых известных историй Мальборка связана с осадой замка в 1410 году.
                    - paragraph [ref=f6e414]: После победы под Грюнвальдом польско-литовское войско под командованием Владислава Ягайло подошло к Мальборку, но крепость взять не смогло. Согласно легенде, во время осады командование Тевтонского ордена собралось в Летней трапезной.
                    - paragraph [ref=f6e415]: Войска Ягайло якобы узнали об этом и попытались попасть пушечным ядром в единственную колонну, поддерживающую своды зала. Если бы колонна рухнула, потолок мог обвалиться вместе со всеми находившимися внутри людьми.
                    - paragraph [ref=f6e416]: Ядро пролетело рядом с колонной и попало в стену. Сейчас над камином действительно находится каменный шар, напоминающий об этой истории. Сам музей осторожно формулирует её как передаваемое из поколения в поколение предание, а не полностью доказанный эпизод осады.
                    - heading "Побег литовского князя Кейстута" [level=2] [ref=f6e417]
                    - paragraph [ref=f6e418]: Другая история связана с литовским князем Кейстутом.
                    - paragraph [ref=f6e419]: В 1361 году он попал в плен к крестоносцам и был заключён в Мальборке. Согласно более поздней традиции, Кейстут сумел склонить на свою сторону одного из охранников. Тот достал для него плащ рыцаря ордена и помог выйти из замка. После побега князь вернулся в Литву.
                    - paragraph [ref=f6e420]: История со временем обросла подробностями, поэтому сейчас сложно отделить подтверждённые события от легенды. Однако сам факт заключения Кейстута в Мальборке и его последующего побега упоминается в исторических материалах города.
                    - paragraph [ref=f6e422]:
                      - img "Кованая дверь в готическом портале" [ref=f6e423]
                    - heading "Аудиогид в замке Мальборк" [level=2] [ref=f6e424]
                    - paragraph [ref=f6e425]: Отдельно стоит сказать про аудиогид. На текущий момент это один из лучших аудиогидов, которыми мы пользовались в польских замках.
                    - paragraph [ref=f6e426]: Он не просто перечисляет даты и имена. В рассказе есть музыка, звуки и небольшие сюжетные эпизоды. Аудиогид сам подсказывает, куда идти дальше, поэтому не приходится постоянно смотреть на карту или искать номер следующего помещения.
                    - paragraph [ref=f6e427]: Можно двигаться в своём темпе, задерживаться в понравившихся залах и не подстраиваться под экскурсионную группу.
                    - paragraph [ref=f6e428]: Есть полноценная версия на русском языке. Аудиогид входит в стоимость исторического маршрута. Кроме русского доступны польский, английский, немецкий, французский, испанский, итальянский, чешский, литовский, украинский и другие языки.
                    - paragraph [ref=f6e429]:
                      - text: Мы были также в замке
                      - link "Ксёнж" [ref=f6e430] [cursor=pointer]:
                        - /url: https://metravel.by/travels/zamok-ksenzh-v-polshe-istoriia-kak-dobratsia-chto-posmotret-tainy-legendy-i-podzemelia
                      - text: ", который нам очень понравился, но сравнивать их сложно. Ксёнж больше воспринимается как дворец с интерьерами разных эпох. Мальборк — это монастырь, крепость, резиденция и отдельный средневековый город внутри стен."
                    - heading "Где поесть" [level=2] [ref=f6e431]
                    - paragraph [ref=f6e432]: На территории замка есть ресторан, но мы в него не заходили, поэтому ничего не могу сказать ни про кухню, ни про цены.
                    - paragraph [ref=f6e433]: Также внутри работает небольшое кафе. Там можно взять кофе, мороженое и десерты. Само кафе находится в замковых помещениях, поэтому оно хорошо вписывается в маршрут. Мы сделали там небольшой перерыв, после чего продолжили осмотр.
                    - generic [ref=f6e434]:
                      - paragraph [ref=f6e435]:
                        - img "Кафе в сводчатых замковых помещениях" [ref=f6e436]
                      - paragraph [ref=f6e437]:
                        - img "Перерыв на кофе внутри замка" [ref=f6e438]
                    - paragraph [ref=f6e439]: "Уже после посещения замка мы зашли в заведение самообслуживания рядом с парковкой. Оно было устроено примерно как столовая: берёшь поднос и выбираешь готовые блюда. Мы брали котлету по-киевски, и всё оказалось действительно вкусным."
                    - heading "Билеты и часы работы в 2026 году" [level=2] [ref=f6e440]
                    - paragraph [ref=f6e441]:
                      - text: В весенне-летнем сезоне, с 25 апреля по 30 сентября 2026 года, полный
                      - strong [ref=f6e442]: исторический маршрут
                      - text: открыт со вторника по воскресенье с 09:00 до 20:00. Последний вход — в 16:30, а музейные интерьеры и выставки закрываются в 19:00.
                    - paragraph [ref=f6e443]: "Стоимость исторического маршрута:"
                    - list [ref=f6e444]:
                      - listitem [ref=f6e445]:
                        - strong [ref=f6e446]: обычный билет — 80 злотых;
                      - listitem [ref=f6e447]:
                        - strong [ref=f6e448]: льготный билет — 60 злотых.
                    - paragraph [ref=f6e449]: В стоимость входит экскурсия на польском языке или аудиогид, в том числе на русском. Полный маршрут включает внутренние помещения и выставки.
                    - paragraph [ref=f6e450]:
                      - text: Есть также сокращённый
                      - strong [ref=f6e451]: прогулочный маршрут
                      - text: ", который проходит через дворы, террасы, сады, рвы и часть укреплений, но не включает основные интерьеры и музейные выставки. Его стоимость в 2026 году составляет 35 злотых за обычный билет и 25 злотых за льготный."
                    - paragraph [ref=f6e452]: По понедельникам прогулочный маршрут можно посетить бесплатно. Бесплатный билет необходимо получить непосредственно в кассе. Главные интерьеры в этот день недоступны.
                    - paragraph [ref=f6e453]: "В осенне-зимнем сезоне маршрут короче, а музей закрывается раньше — ориентируйтесь на 10:00–15:00 с последним входом за 2–3 часа до закрытия. Точное расписание перед поездкой лучше проверить ещё раз: режим работы меняется в зависимости от сезона, праздников и специальных мероприятий."
                    - paragraph [ref=f6e454]: "Билеты онлайн стоит брать заранее, особенно летом: у музея есть лимит посетителей в час, и на популярное время места заканчиваются."
                    - paragraph [ref=f6e455]:
                      - link "Официальный сайт замка Мальборк" [ref=f6e456] [cursor=pointer]:
                        - /url: https://zamek.malbork.pl/
                    - paragraph [ref=f6e457]:
                      - link "Официальная покупка билетов онлайн" [ref=f6e458] [cursor=pointer]:
                        - /url: https://bilety.zamek.malbork.pl/
                    - heading "Сколько времени выделить" [level=2] [ref=f6e459]
                    - paragraph [ref=f6e460]: Я бы планировала не меньше четырёх часов. У нас на посещение ушло около половины дня, и при этом мы не рассматривали подробно каждый экспонат.
                    - paragraph [ref=f6e461]: Замок большой, по маршруту приходится много ходить, подниматься по лестницам и переходить между разными частями комплекса. Лучше приехать утром, надеть удобную обувь и не планировать сразу после него ещё несколько крупных музеев.
                    - paragraph [ref=f6e462]: "Апрельский будний день оказался для нас хорошим временем: людей было немного, в кассах не было очередей, а внутри можно было спокойно останавливаться и слушать аудиогид."
                    - paragraph [ref=f6e463]: Летом я бы обязательно купила билеты заранее.
                    - heading "Как добраться" [level=2] [ref=f6e464]
                    - list [ref=f6e465]:
                      - listitem [ref=f6e466]:
                        - strong [ref=f6e467]: "Из Гданьска на машине:"
                        - text: около 60 км по S7 и DK22, примерно час с учётом съездов и городских участков.
                      - listitem [ref=f6e468]:
                        - strong [ref=f6e469]: "Из Гданьска на поезде:"
                        - text: прямые поезда с вокзала Gdańsk Główny идут 35–50 минут и ходят часто. От вокзала Мальборка до замка — около 10 минут пешком.
                      - listitem [ref=f6e470]:
                        - strong [ref=f6e471]: "Из Варшавы:"
                        - text: около 290 км, порядка 3 часов на машине; поезда идут 2,5–3 часа.
                      - listitem [ref=f6e472]:
                        - strong [ref=f6e473]: "Из Эльблонга:"
                        - text: 30 км, меньше получаса — удобно, если едете вдоль Вислинского залива.
                    - paragraph [ref=f6e474]: "Парковки: несколько платных стоянок вдоль улицы Wałowa и крытая парковка недалеко от входа. В будний день весной мест хватало."
                    - paragraph [ref=f6e475]: "В Мальборке можно остановиться на ночь: в городе есть несколько гостиниц прямо у стен замка, и вечером, когда туристические автобусы уезжают, крепость в подсветке производит совсем другое впечатление."
                    - heading "Что ещё посмотреть в Мальборке" [level=2] [ref=f6e476]
                    - paragraph [ref=f6e477]: "После замка стоит пройти к противоположному берегу Ногата. Именно оттуда открывается общий вид на весь комплекс и становится понятен его настоящий размер: почти километр кирпичных стен, отражающихся в воде."
                    - generic [ref=f6e478]:
                      - paragraph [ref=f6e479]:
                        - img "Панорама всего комплекса Мальборка с противоположного берега Ногата" [ref=f6e480]
                      - paragraph [ref=f6e481]:
                        - img "Замок Мальборк и пристань на Ногате" [ref=f6e482]
                    - paragraph [ref=f6e483]: "В самом городе сохранилось несколько средневековых объектов:"
                    - list [ref=f6e484]:
                      - listitem [ref=f6e485]: Мариацкие ворота;
                      - listitem [ref=f6e486]: Гончарные ворота;
                      - listitem [ref=f6e487]: старая ратуша;
                      - listitem [ref=f6e488]: церковь Святого Иоанна Крестителя;
                      - listitem [ref=f6e489]: участки городских оборонительных стен.
                    - paragraph [ref=f6e490]: В туристический сезон по Ногату проводятся прогулочные рейсы. В городе также работают Музей города Мальборка и Динопарк, который в первую очередь рассчитан на семьи с детьми.
                    - paragraph [ref=f6e491]: Но после нескольких часов в замке у нас уже не осталось желания идти ещё в один музей. Мы немного прогулялись возле реки, поели и вернулись обратно на побережье.
                    - 'heading "Билет на три замка: Мальборк, Штум и Квидзын" [level=2] [ref=f6e492]'
                    - paragraph [ref=f6e493]:
                      - text: Раньше можно было встретить информацию о комбинированном билете на два замка. Сейчас музей предлагает
                      - strong [ref=f6e494]: билет на три замка
                      - text: ": Мальборк, Штум и Квидзын."
                    - paragraph [ref=f6e495]: Билет действует 14 дней и позволяет по одному разу посетить каждый объект. В 2026 году он стоит 105 злотых для взрослого и 75 злотых по льготному тарифу. В Мальборке в стоимость входит исторический маршрут с аудиогидом или польским экскурсоводом, а в Штуме и Квидзыне — аудиогид.
                    - heading "Замок в Штуме" [level=3] [ref=f6e496]
                    - paragraph [ref=f6e497]: Штум находится примерно в 14 километрах к югу от Мальборка. Его замок намного меньше и сохранился хуже, но это логичное продолжение маршрута.
                    - paragraph [ref=f6e498]: Он строился в конце XIV — начале XV века и использовался как загородная резиденция великих магистров. Позднее здесь размещались польские старосты. Сейчас внутри работает выставка, посвящённая истории замка и его реконструкции.
                    - paragraph [ref=f6e499]: Штум можно добавить в тот же день, но только если начать осмотр Мальборка рано утром и не задерживаться в каждом зале.
                    - heading "Замок в Квидзыне" [level=3] [ref=f6e500]
                    - paragraph [ref=f6e501]: Замок в Квидзыне интересен тем, что соединён с готическим кафедральным собором. Его самая узнаваемая часть — большая башня-данскер, или гданиско, соединённая с основным зданием длинной крытой галереей.
                    - paragraph [ref=f6e502]: Внешне Квидзын сильно отличается от Мальборка, поэтому он не воспринимается как уменьшенная копия того же замка. Музей называет комплекс замка и собора одним из наиболее узнаваемых готических сооружений Польши.
                    - paragraph [ref=f6e503]: Три замка лучше распределить на два дня. Мальборку стоит отдать отдельный день или хотя бы его большую часть, а Штум и Квидзын объединить в следующий маршрут.
                    - heading "Стоит ли ехать в замок Мальборк" [level=2] [ref=f6e504]
                    - paragraph [ref=f6e505]: Даже если на фотографиях Мальборк не кажется вам особенно интересным, внутри он может полностью изменить впечатление.
                    - paragraph [ref=f6e506]: Мне казалось, что я примерно представляю, что там будет. На месте оказалось, что фотографии показывают только внешние стены и почти ничего не передают о внутренних пространствах.
                    - paragraph [ref=f6e508]:
                      - img "На мосту через Ногат, за спиной — Мальборк" [ref=f6e509]
                    - paragraph [ref=f6e510]: Здесь стоит ехать не только ради статуса крупнейшего кирпичного замка или объекта ЮНЕСКО. В Мальборке действительно интересно ходить по залам, слушать истории и постепенно разбираться, как был устроен этот огромный комплекс.
                    - paragraph [ref=f6e511]: Из польских замков, в которых мы успели побывать, Мальборк запомнился прежде всего масштабом и аудиогидом. Он оказался намного интереснее, чем я ожидала, и точно стоил отдельной поездки с Балтийского побережья.
                    - heading "Что рядом" [level=2] [ref=f6e512]
                    - list [ref=f6e513]:
                      - listitem [ref=f6e514]:
                        - 'link "Польша за 4 дня: Сувалки — Эльблонг — Гданьск — Леба" [ref=f6e515] [cursor=pointer]':
