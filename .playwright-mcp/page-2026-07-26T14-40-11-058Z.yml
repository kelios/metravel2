                    - heading "День 5. Кролики, поля и Фекан" [level=2] [ref=e585]
                    - paragraph [ref=e587]:
                      - img "Улица Фекана" [ref=e588]
                    - paragraph [ref=e589]: "Шли в основном по открытым утёсам. Самое милое — кролики: на участке у края скал, где старые дома и территория выселены, теперь живут сотни кроликов с норками. Появился ветер, собиралась гроза (но так и не случилась). Дошли к полудню, около двадцати километров. Заселение здесь по-божески — с 15:30, самая дешёвая двухзвёздочная гостиница почти на первой линии, снова старинный дом с винтовой лестницей."
                    - paragraph [ref=e590]:
                      - text: А вечером —
                      - strong [ref=e591]: Фекан (Fécamp)
                      - text: ", просто восхитительный: замок, церкви. Здесь стоит попробовать знаменитый ликёр Бенедиктин по старинным рецептам, кальвадос и рыбу. Мы заказали ската, утку, тартар, салат с козьим сыром и два десерта — нормандский с кальвадосом и крем-брюле с бенедиктином. Восхитительный день."
