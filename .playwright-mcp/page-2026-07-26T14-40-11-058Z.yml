                      - paragraph [ref=e386]:
                        - img "Вид на крыши Дьепа" [ref=e387]
                    - paragraph [ref=e388]: "В первый день прошли километров двадцать пять по жаре — но шли много через лес, так что было терпимо. А потом — пять километров вдоль моря: с одной стороны вода, с другой белые утёсы. Вода, удивительно, совсем тёплая, можно купаться."
