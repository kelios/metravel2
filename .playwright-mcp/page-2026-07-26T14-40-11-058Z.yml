                    - paragraph [ref=e540]
                    - paragraph [ref=e541]: "По красоте день спорный: последние десять километров мы практически всё время обходили атомную станцию, местами прямо вдоль трассы по высокой траве. Тяжело, но без вчерашней влажности — чуть легче. Зато в большом городке по пути попробовали мидии — вот это был восторг (после консервированных - небо и земля)."
                    - generic [ref=e542]:
                      - paragraph [ref=e543]:
