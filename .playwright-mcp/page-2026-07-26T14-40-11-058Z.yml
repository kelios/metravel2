                      - paragraph [ref=e553]:
                        - img "Селфи вдвоём после долгого перехода" [ref=e554]
                      - paragraph [ref=e555]:
                        - img "Путник на широкой грунтовой дороге" [ref=e556]
                    - paragraph [ref=e557]:
                      - text: "Ночевали в старинном шале с огромным парком прямо напротив атомной станции: винтовая лестница, комната под крышей за 100 €, душ и туалет общие. Чисто и аккуратно, но без кондиционера в такую жару комната не проветривалась совсем."
                      - img "Усадьба-гостиница за оградой" [ref=e558]
                    - paragraph [ref=e560]:
                      - img "Лестница с красной ковровой дорожкой" [ref=e561]
                    - paragraph [ref=e562]
                    - heading "День 4. Лес, деревни и сарайчик в плесени" [level=2] [ref=e563]
                    - paragraph [ref=e564]: "Пожалуй, самый приятный день: дорога почти всё время шла лесами, с парой красивых бухтовых долин. Минус — негде было поесть: магазины есть, ресторанов нет, обошлись бананами из магазина. День жаркий, за тридцать, но в лесу терпимо; к трём завалились на пляж. Ночёвка — снова «сарайчик» за 200 €, как старый автодом: душно и весь в плесени (потолок, двери) — в этом регионе с влажностью это обычное дело. В соседнем кемпинге был бассейн и «тарелки» (сыр, колбаса, вино, мороженое) — пиццу, правда, в этот день не делали."
