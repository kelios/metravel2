                      - listitem [ref=e645]:
                        - strong [ref=e646]: Приливы и отливы — обязательно.
                        - text: "Если идёте низом по пляжу/дну моря, сверяйте расписание приливов заранее: вода прибывает очень быстро, это вопрос безопасности."
                      - listitem [ref=e647]:
                        - strong [ref=e648]: Скалы обваливаются.
                        - text: Не подходите вплотную к подножию утёсов и не сидите под ними — особенно в районе Этрета.
                      - listitem [ref=e649]:
                        - strong [ref=e650]: Жильё бронируйте заранее
                        - text: и держите запасной вариант, особенно в жару и в сезон. Будьте готовы к ценам 100–200 € за ночь и к старым домам с винтовыми лестницами (местами сыро/плесень — это нормандская норма).
                      - listitem [ref=e651]:
                        - strong [ref=e652]: Жара.
                        - text: В аномальную жару выходите как можно раньше (6–7 утра); на открытом плато тени нет совсем — низом у моря всегда легче из-за бриза.
                      - listitem [ref=e653]:
                        - strong [ref=e654]: Еда по расписанию.
                        - text: Кухни работают по времени (обед заканчивается рано) — не рассчитывайте поесть в 15:00; берите перекус с собой.
                      - listitem [ref=e655]:
                        - strong [ref=e656]: "Что попробовать:"
                        - text: мидии и устрицы (здесь они великолепны), ликёр Бенедиктин и кальвадос в Фекане, французский сидр, нормандские десерты.
                    - paragraph [ref=e657]: "Шесть дней Алебастрового берега — это меловые скалы, тёплое море, кролики на обрывах, родник, сочащийся прямо из скалы, и лучшие устрицы в нашей жизни. Маршрут не технический, но в жару и с приливами требует уважения и подготовки. И да — оно того стоит: таких пейзажей мы не видели нигде."
