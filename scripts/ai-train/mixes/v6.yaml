# metravel-llm v6 (#2751): the v4 adapter continues on one stage where the S1 skills
# the assistant rounds eroded (osm_intents 9 → 6 → 8, wikivoyage 4 → 2 → 2) are
# trained DIRECTLY, not left to a random replay draw: stage s3 holds rag_answers
# edition 6 + offtopic + the rebuilt osm_intents (07.11.2026, PBF cache: country in the
# prompt, describe without invented endings) + wikivoyage; toponyms, translations and
# site form the replay pool (0.25, site-heavy — site fell 11 → 9 on v5-rag).
# Only s3 is trained (lora-qwen3.5-4b-v6.yaml resumes adapters/metravel-llm-v4);
# s1 exists for the replay pool. v4, v5 and v5-rag are never overwritten.
name: v6
seed: 20261017
split: {by: key, valid_share: 0.03, test_share: 0.02}
sets:
  toponyms:     {weight: 1.0, cap_tokens: 350000}
  translations: {weight: 1.0, cap_tokens: 400000, options: {kind_share: {quest_card_from_ru: 0.7, quest_card_l: 0.5, ui_strings: 0.12, quest_translate: 0.03}}}
  site:         {weight: 1.0, cap_tokens: 1200000, options: {chunk_chars: 2600, structured: true}}
  # Intents over describe: the map filter slice and /ai/intent read constraints (dogs, camper),
  # which v4 drops; descriptions stay for the POI voice.
  osm_intents:  {weight: 1.0, cap_tokens: 100000, options: {intents: 2500, describe: 1200, centres: 250, lang_share: {be: 0.1, pl: 0.1}}}
  wikivoyage:   {weight: 0.7, cap_tokens: 120000}
  rag_answers:  {weight: 1.0, options: {per_place: 1, edition: 6}}
  offtopic:     {weight: 1.0, cap_tokens: 18000, options: {variants: 1}}
stages:
  - {name: s1, sets: [toponyms, translations, site]}
  - {name: s3, sets: [osm_intents, wikivoyage, rag_answers, offtopic]}
replay: 0.25
