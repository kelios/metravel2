# metravel-llm v3 (#2712): the v2 adapter continues on the assistant's mode —
# answers from retrieved cards (rag_answers) and the off-topic refusal
# (offtopic) — with 20 % replay of the v2 stages so the site and language
# slices do not drift. S1/S2 are rebuilt by the same seed only to feed the
# replay; v3 trains stage s3 alone, resuming adapters/metravel-llm-v2
# (lora-qwen3.5-4b-v3.yaml). Prompts per slice: eval_prompts/{rag_answers,offtopic}.jsonl;
# the assistant screen as a whole is measured by scripts/ai-assistant-eval (#2710).
name: v3
seed: 20261017
split: {by: key, valid_share: 0.03, test_share: 0.02}
sets:
  toponyms:     {weight: 1.0, cap_tokens: 400000}
  translations: {weight: 1.0, cap_tokens: 500000, options: {kind_share: {quest_card_from_ru: 0.7, quest_card_l: 0.5, ui_strings: 0.12, quest_translate: 0.03}}}
  wikivoyage:   {weight: 0.7, cap_tokens: 1500000}
  osm_intents:  {weight: 1.0, cap_tokens: 300000}
  site:         {weight: 1.0, cap_tokens: 4000000, options: {chunk_chars: 2600, structured: true}}
  rag_answers:  {weight: 1.0, cap_tokens: 900000, options: {per_place: 3}}
  offtopic:     {weight: 1.0, cap_tokens: 250000}
stages:
  - {name: s1, sets: [toponyms, translations, wikivoyage, osm_intents]}
  - {name: s2, sets: [site]}
  - {name: s3, sets: [rag_answers, offtopic]}
replay: 0.2
