# Isolated v5 continuation from v4. Exact token-safe preparation writes s3-fit.
# One epoch of the prepared 2026-10-25 split: 460 constraints, 23 off-topic,
# 320 S1/S2 replay examples. Two oversized translations were excluded intact.
model: models/Qwen3.5-4B-MLX-4bit
data: data/sft-v5/s3-fit
train: true
fine_tune_type: lora
optimizer: adamw
mask_prompt: true
num_layers: 6
batch_size: 1
grad_accumulation_steps: 1
iters: 803
resume_adapter_file: adapters/metravel-llm-v4/adapters.safetensors
learning_rate: 2.0e-5
max_seq_length: 1024
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 100
val_batches: 10
save_every: 100
adapter_path: adapters/metravel-llm-v5
seed: 20261028
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [2.0e-5, 803, 1.0e-6]
